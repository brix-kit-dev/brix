# ============================================================================
# Secret Scan (root S-4; brix-enterprise standard-link plan D147-D151)
# ============================================================================
#
# gitleaks looks for secrets in every commit of the pushed history and in the
# files as they are now, on every push to any branch and every pull request,
# docs included: a secret pushed to any branch has already left the machine.
# Findings are redacted: the log and the annotations name the rule, the file,
# the line and the commit, never the value.
#
# - gitleaks is the open-source command line, pinned to one release and checked
#   against the sha256 below before it runs (D147).
# - A finding that is no secret is allowed one by one, with its reason (D149):
#   a sample that has to stay, such as a test fixture, carries gitleaks:allow
#   on its line and the reason in a comment above it; a finding in an old
#   commit is listed in .gitleaksignore by its fingerprint, the reason above it.
# - No private key, key store or environment file may be committed; the
#   .env.example, .env.template and .env.sample files are examples (D150).
# ============================================================================

name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded pull request runs; a push runs to the end, so each push has
# a result of its own.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The token must not sit in .git/config, where the file scan would find it.
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every commit of the pushed history
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 0 --log-opts="HEAD" \
            --report-format json --report-path "$RUNNER_TEMP/history.json" .

      - name: Scan the files as they are now
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --verbose --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/files.json" .

      - name: Report the findings
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          total=0
          for scan in history files; do
            report="$RUNNER_TEMP/$scan.json"
            [ -s "$report" ] || { echo "::error title=gitleaks::the $scan scan wrote no report"; exit 1; }
            jq -r --arg scan "$scan" '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::\(.Description) (\($scan) scan"
              + (if (.Commit // "") != "" then ", commit \(.Commit[0:12])" else "" end) + ", fingerprint \(.Fingerprint))"' "$report"
            count=$(jq length "$report")
            echo "$scan scan: $count finding(s)"
            total=$((total + count))
          done
          [ "$total" -eq 0 ]

      - name: No private key, key store or environment file is committed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found=$(git ls-files \
            | grep -E '\.(pem|p12|pfx|jks|keystore|key)$|(^|/)\.env(\.[^/]+)?$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' \
            | grep -vE '(^|/)\.env\.(example|template|sample)$|\.example\.[^/]+$' || true)
          if [ -n "$found" ]; then
            while IFS= read -r file; do
              echo "::error file=$file,title=Key or environment file::$file must not be committed (root S-4): keep keys, key stores and .env files out of git"
            done <<< "$found"
            exit 1
          fi
          echo "no private key, key store or environment file is committed"
