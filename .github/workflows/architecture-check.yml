# ============================================================================
# Architecture Check (Brix SDK)
# ============================================================================
#
# Phase 3 / C-6 — CI gate for the brix open-source monorepo.
#
# Each check is a job of its own, so that one failing check never hides another (standard-link plan queue item 16,
# 16a). Until 2026-11 the checks below ran as steps of one job behind a Maven dependency analysis that could only fail
# on a fresh runner, and none of them had run on main since 2026-08-03.
#   - Architecture governance and guard tests (Java)
#   - Platform admin redline scan
#   - TypeScript dependency cycle check
#   - ESLint architecture rule tests
#   - Platform console architecture test (platform-admin-web's public API and View/Hook/Repository boundaries, 16e;
#     its permission and role constants against the Java catalog, queue item 18, 18c)
#   - Lint of the SDK packages that have an ESLint configuration (16c)
#   - Typecheck across the SDK packages
#   - Scaffold smoke of create-brix's governed Phase 7 templates (16f)
#
# A failed test (Java or ESLint rule) or redline finding is also written as an annotation: the annotations of a run can
# be read through the API without signing in, its log cannot.
#
# Every push to main or develop runs it, whatever the push changes (16b): the redline scan reads Java, SQL, YAML and
# JSON, the guard tests read the guard's resources, and a push outside the old path list used to run none of them.
#
# This workflow intentionally does NOT include @brix-sdk/enterprise-*
# packages — those live in the brix-enterprise repository and are gated
# by `architecture-check.yml` there.
#
# The v3.0.10 Phase 0 guard job (runtime-sdk-api's tests and a grep of three legacy markers) was removed in 16g
# (D140): those tests run in Code Coverage with the whole build, and the v3.0.10 root is superseded.
# ============================================================================

name: Architecture Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/package.json'
      - 'packages/**/tsconfig.json'
      - 'packages/**/pom.xml'
      - 'packages/@brix/platform-devtools/architecture-governance/**'
      - 'packages/@brix/platform-devtools/architecture-guard/**'
      - 'packages/@brix/platform-devtools/schemas/**'
      - 'docs/runtime-shell/**'
      - 'packages/**/vitest.config.*'
      - 'packages/@brix/platform-devtools/@brix/create-brix/templates/**'
      - 'scripts/check-banned-tokens.mjs'
      - 'scripts/ci-test-annotations.mjs'
      - 'scripts/lint-configured-packages.mjs'
      - 'scripts/validate_architecture_context.py'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/architecture-check.yml'
      - 'package.json'
      - 'pom.xml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, develop]

# Cancel superseded pull request runs to keep the queue short. A push runs to the end, so each push to main has a
# result of its own (standard-link plan queue item 16, 16b).
concurrency:
  group: architecture-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-context-pointer:
    name: Architecture Context AI Pointers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ChatGPT and Claude pointers
        run: python3 scripts/validate_architecture_context.py

  # ==========================================================================
  # One job per check (standard-link plan queue item 16, 16a, D139): a check that fails must not hide the checks after
  # it. The Maven dependency analysis that used to run first is gone: it named one module without the modules it depends
  # on, so a fresh runner could not resolve it, and it never compiled, so it never analysed anything either.
  # ==========================================================================
  architecture-guard-tests:
    name: Architecture governance and guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Maven's downloads come from the Actions cache, as in Code Coverage: without it every run downloaded them from
      # Maven Central, and twice a run failed before any test (standard-link queue item 22, 22d).
      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Architecture governance and guard tests
        run: |
          set -o pipefail
          mvn -B -ntp -pl :architecture-governance,:architecture-guard test 2>&1 | tee "$RUNNER_TEMP/guard-tests.log"

      - name: Annotate failed tests
        if: failure()
        run: >-
          node scripts/ci-test-annotations.mjs
          packages/@brix/platform-devtools/architecture-governance
          packages/@brix/platform-devtools/architecture-guard

      # A run that fails before any test, as when a dependency cannot be resolved, leaves no test report, and its log
      # needs a signed-in reader: the lines in which Maven says why become annotations, which anyone can read.
      - name: Annotate the Maven failure
        if: failure()
        run: >-
          grep -m 3 -E '^\[ERROR\] (Failed to execute goal|Could not|Non-resolvable)' "$RUNNER_TEMP/guard-tests.log"
          | sed -e 's/%/%25/g' -e 's/^/::error title=Maven::/' || true

      - name: Upload Phase 6 evidence report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-architecture-evidence
          path: packages/@brix/platform-devtools/architecture-governance/target/phase6-evidence/

  redline-scan:
    name: Platform admin redline scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Platform admin redline scan
        run: node scripts/check-banned-tokens.mjs

  dependency-cycles:
    name: TypeScript dependency cycle check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # Dependency governance — Phase 2 / DEP-1.
      # Fails on TypeScript import cycles before they can harden into layer
      # coupling between SDK packages.
      # ----------------------------------------------------------------------
      - name: TypeScript dependency cycle check
        run: |
          find packages/@brix -type f \( -name '*.ts' -o -name '*.tsx' \) \
            ! -path '*/dist/*' \
            ! -path '*/target/*' \
            ! -path '*/node_modules/*' \
            ! -path 'packages/@brix/shared-runtime/shared-runtime-web/src/*' \
            -print0 \
            | xargs -0 pnpm dlx madge@6.1.0 --circular --extensions ts,tsx

  eslint-architecture-rules:
    name: ESLint architecture rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # The governance rules that protect the architecture boundary.
      # Package-level test suites are owned by their package workflows.
      # ----------------------------------------------------------------------
      - name: Run architecture unit tests
        run: >-
          pnpm --filter @brix-sdk/eslint-config-architecture run test
          --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/eslint-architecture-rules.xml"
        env:
          CI: true

      # Vitest's own GitHub reporter skips a failure thrown inside RuleTester, so the JUnit report is annotated instead.
      - name: Annotate failed tests
        if: failure()
        run: node scripts/ci-test-annotations.mjs "$RUNNER_TEMP/eslint-architecture-rules.xml"

  console-architecture-test:
    name: Platform console architecture test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # Root A-7, frontend FE-1/FE-2: platform-admin-web publishes no Page,
      # Hook or Repository entry, Pages reach Repositories only through Hooks,
      # and Hooks and Pages make no network calls (standard-link plan queue
      # item 16, 16e). Super-admin BRX-SA-AUTH-006: the console's permission
      # and role constants equal the Java catalog in platform-auth-api, and no
      # source names a permission ID as a bare string (queue item 18, 18c,
      # D160). Only these files: the package's other tests are not
      # architecture tests (D144).
      # ----------------------------------------------------------------------
      - name: Run the console architecture test
        run: >-
          pnpm --filter @brix-sdk/platform-admin-web run test src/public-api-architecture.test.ts src/permission-catalog.test.ts
          --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/console-architecture.xml"
        env:
          CI: true

      - name: Annotate failed tests
        if: failure()
        run: node scripts/ci-test-annotations.mjs "$RUNNER_TEMP/console-architecture.xml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # Step: Lint — each package's `lint` script with its ESLint configuration
      # (standard-link plan queue item 16, 16c). Every package with TypeScript
      # sources must have both, and lints with the preset of its layer from
      # @brix-sdk/eslint-config-architecture (queue item 19, 19d, D163): a
      # package that has sources but no lint script, or a lint script but no
      # configuration, fails the step. The workspace roots below only run their
      # members' lint and stay out.
      # ----------------------------------------------------------------------
      - name: Lint
        run: >-
          node scripts/lint-configured-packages.mjs
          --skip @brix-sdk/infra-adapters-workspace
          --skip @brix-sdk/platform-commons
          --skip platform-devtools
          --skip @brix-sdk/runtime-sdk-workspace
          --skip @brix-sdk/shared-runtime-workspace
        env:
          CI: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages whose declarations live in dist/. The list is in the script, shared with brix-enterprise's
      # Frontend Stability job (standard-link plan queue item 19, 19h, D165).
      - name: Build TypeScript type dependencies
        run: node scripts/build-type-dependencies.mjs
        env:
          CI: true

      # ----------------------------------------------------------------------
      # Step: Typecheck — fail-at-end so that a single broken package does
      # not hide unrelated regressions.
      # ----------------------------------------------------------------------
      - name: Typecheck
        run: |
          pnpm -r --if-present \
            --filter '!@brix-sdk/infra-adapters-workspace' \
            --filter '!@brix-sdk/platform-commons' \
            --filter '!platform-devtools' \
            --filter '!@brix-sdk/runtime-sdk-workspace' \
            --filter '!@brix-sdk/shared-runtime-workspace' \
            --filter '!@brix-sdk/infra-adapter-ui-mui' \
            --filter '!@brix-sdk/infra-adapter-ui-native' \
            run typecheck
        env:
          CI: true

  scaffold-smoke:
    name: create-brix Scaffold Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java for the Maven build of the generated projects below. It comes before `pnpm install`: the Maven cache key
      # hashes every pom.xml of the workspace, and with node_modules in place that walk took over a minute.
      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build create-brix
        run: pnpm --filter @brix-sdk/create-brix build

      # ----------------------------------------------------------------------
      # The governed Phase 7 templates (plugin, operational module, UI): every
      # generated file is free of the forbidden patterns (controllers, scans,
      # broker and JDBC clients, fetch/axios, UI vendors, placeholders), the
      # manifests and the contract lock test are there, unsafe names are refused
      # and the legacy scan finds nothing (standard-link plan queue item 16,
      # 16f). This job used to run the legacy `create-brix app` entry, which
      # Runtime Shell v3.0.10 Phase 0 disabled, and failed on every run.
      # ----------------------------------------------------------------------
      - name: Governed scaffold smoke (Phase 7)
        run: |
          set -o pipefail
          pnpm --filter @brix-sdk/create-brix run test:phase7 2>&1 | tee "$RUNNER_TEMP/scaffold-smoke.log"

      - name: Annotate the failure
        if: failure()
        run: >-
          grep -m 5 -E '^(AssertionError|Error)' "$RUNNER_TEMP/scaffold-smoke.log"
          | sed -e 's/%/%25/g' -e 's/^/::error title=Scaffold smoke::/' || true

      # ----------------------------------------------------------------------
      # The generated plugin and operational module are built with Maven
      # against this commit's brix modules and run their own tests: the guard
      # in every module and the plugin's contract lock (standard-link plan queue
      # item 22, 22e, D184). The smoke above only reads the generated files; a
      # template that does not compile, or one that breaks a guard rule, fails
      # here. The brix modules are installed into the runner's own repository
      # and removed before the Maven cache is saved.
      # ----------------------------------------------------------------------
      - name: Install the brix modules a generated project uses
        run: >-
          mvn -B -ntp -DskipTests install
          -pl :runtime-sdk-api,:runtime-contract-generator,:runtime-orchestrator,:architecture-guard -am

      - name: Build the generated plugin and operational module
        run: |
          set -o pipefail
          pnpm --filter @brix-sdk/create-brix run test:phase7:maven 2>&1 | tee "$RUNNER_TEMP/scaffold-maven.log"

      - name: Annotate the build failure
        if: failure()
        run: >-
          grep -m 5 -E '^(AssertionError|Error)|^\[ERROR\] (Failed to execute goal|Could not|Non-resolvable|COMPILATION ERROR)'
          "$RUNNER_TEMP/scaffold-maven.log"
          | sed -e 's/%/%25/g' -e 's/^/::error title=Scaffold build::/' || true

      - name: Keep brix's own modules out of the Maven cache
        if: always()
        run: rm -rf ~/.m2/repository/io/brix
