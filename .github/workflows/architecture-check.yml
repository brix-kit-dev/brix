# ============================================================================
# Architecture Check (Brix SDK)
# ============================================================================
#
# Phase 3 / C-6 — CI gate for the brix open-source monorepo.
#
# Each check is a job of its own, so that one failing check never hides another (standard-link plan queue item 16,
# 16a). Until 2026-11 the checks below ran as steps of one job behind a Maven dependency analysis that could only fail
# on a fresh runner, and none of them had run on main since 2026-08-03.
#   - Architecture governance and guard tests (Java)
#   - Platform admin redline scan
#   - TypeScript dependency cycle check
#   - ESLint architecture rule tests
#   - Lint of the SDK packages that have an ESLint configuration (16c)
#   - Typecheck across the SDK packages
#
# A failed test (Java or ESLint rule) or redline finding is also written as an annotation: the annotations of a run can
# be read through the API without signing in, its log cannot.
#
# Every push to main or develop runs it, whatever the push changes (16b): the redline scan reads Java, SQL, YAML and
# JSON, the guard tests read the guard's resources, and a push outside the old path list used to run none of them.
#
# This workflow intentionally does NOT include @brix-sdk/enterprise-*
# packages — those live in the brix-enterprise repository and are gated
# by `architecture-check.yml` there.
#
# v3.0.10 Runtime Shell Phase 0 adds an OSS guard for the shared contract and
# manifest baseline only. The concrete tenant-only Host/profile gate is owned by
# brix-enterprise because app-tenant is not part of this repository.
#
# @see docs/runtime-shell/v3.0.10-phase-0-baseline.md
# ============================================================================

name: Architecture Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/package.json'
      - 'packages/**/tsconfig.json'
      - 'packages/**/pom.xml'
      - 'packages/@brix/platform-devtools/architecture-governance/**'
      - 'packages/@brix/platform-devtools/architecture-guard/**'
      - 'packages/@brix/platform-devtools/schemas/**'
      - 'docs/runtime-shell/**'
      - 'packages/**/vitest.config.*'
      - 'packages/@brix/platform-devtools/@brix/create-brix/templates/**'
      - 'scripts/check-banned-tokens.mjs'
      - 'scripts/ci-test-annotations.mjs'
      - 'scripts/lint-configured-packages.mjs'
      - 'scripts/validate_architecture_context.py'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/architecture-check.yml'
      - 'package.json'
      - 'pom.xml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, develop]

# Cancel superseded pull request runs to keep the queue short. A push runs to the end, so each push to main has a
# result of its own (standard-link plan queue item 16, 16b).
concurrency:
  group: architecture-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-context-pointer:
    name: Architecture Context AI Pointers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ChatGPT and Claude pointers
        run: python3 scripts/validate_architecture_context.py

  runtime-shell-v3-0-10-phase-0:
    name: Runtime Shell v3.0.10 Phase 0 Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate OSS runtime contract baseline
        run: mvn -q -pl packages/@brix/runtime-sdk/runtime-sdk-api test

      - name: Validate Phase 0 legacy inventory
        run: |
          set -euo pipefail
          grep -RIn '@Deprecated(since = "3.0.10", forRemoval = false)' \
            packages/@brix/runtime-sdk/runtime-sdk-api/src/main/java/io/runtime/sdk/context/RuntimeContext.java \
            packages/@brix/runtime-sdk/runtime-sdk-api/src/main/java/io/runtime/sdk/support/AbstractModule.java \
            packages/@brix/runtime-sdk/runtime-sdk-api/src/main/java/io/runtime/sdk/capability/LifecycleCapability.java
          grep -RIn 'brix.runtime-shell.model=3.0.10' docs/runtime-shell/v3.0.10-phase-0-baseline.md
          grep -RIn 'compatibility schema only' packages/@brix/platform-devtools/schemas/plugin-manifest.schema.json

  # ==========================================================================
  # One job per check (standard-link plan queue item 16, 16a, D139): a check that fails must not hide the checks after
  # it. The Maven dependency analysis that used to run first is gone: it named one module without the modules it depends
  # on, so a fresh runner could not resolve it, and it never compiled, so it never analysed anything either.
  # ==========================================================================
  architecture-guard-tests:
    name: Architecture governance and guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Architecture governance and guard tests
        run: mvn -B -ntp -pl :architecture-governance,:architecture-guard test

      - name: Annotate failed tests
        if: failure()
        run: >-
          node scripts/ci-test-annotations.mjs
          packages/@brix/platform-devtools/architecture-governance
          packages/@brix/platform-devtools/architecture-guard

      - name: Upload Phase 6 evidence report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-architecture-evidence
          path: packages/@brix/platform-devtools/architecture-governance/target/phase6-evidence/

  redline-scan:
    name: Platform admin redline scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Platform admin redline scan
        run: node scripts/check-banned-tokens.mjs

  dependency-cycles:
    name: TypeScript dependency cycle check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # Dependency governance — Phase 2 / DEP-1.
      # Fails on TypeScript import cycles before they can harden into layer
      # coupling between SDK packages.
      # ----------------------------------------------------------------------
      - name: TypeScript dependency cycle check
        run: |
          find packages/@brix -type f \( -name '*.ts' -o -name '*.tsx' \) \
            ! -path '*/dist/*' \
            ! -path '*/target/*' \
            ! -path '*/node_modules/*' \
            ! -path 'packages/@brix/shared-runtime/shared-runtime-web/src/*' \
            -print0 \
            | xargs -0 pnpm dlx madge@6.1.0 --circular --extensions ts,tsx

  eslint-architecture-rules:
    name: ESLint architecture rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # The governance rules that protect the architecture boundary.
      # Package-level test suites are owned by their package workflows.
      # ----------------------------------------------------------------------
      - name: Run architecture unit tests
        run: >-
          pnpm --filter @brix-sdk/eslint-config-architecture run test
          --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/eslint-architecture-rules.xml"
        env:
          CI: true

      # Vitest's own GitHub reporter skips a failure thrown inside RuleTester, so the JUnit report is annotated instead.
      - name: Annotate failed tests
        if: failure()
        run: node scripts/ci-test-annotations.mjs "$RUNNER_TEMP/eslint-architecture-rules.xml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # Step: Lint — each package with a `lint` script and an ESLint
      # configuration it can find (standard-link plan queue item 16, 16c).
      # A package without one is listed, not linted: its lint stops with
      # "couldn't find a configuration file" before checking anything, and
      # queue item 19 gives it one (D142). The packages below stay out, as before.
      # ----------------------------------------------------------------------
      - name: Lint
        run: >-
          node scripts/lint-configured-packages.mjs
          --skip @brix-sdk/infra-adapters-workspace
          --skip @brix-sdk/platform-commons
          --skip platform-devtools
          --skip @brix-sdk/runtime-sdk-workspace
          --skip @brix-sdk/shared-runtime-workspace
          --skip @brix-sdk/infra-adapter-ui-mui
          --skip @brix-sdk/infra-adapter-ui-native
        env:
          CI: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript type dependencies
        run: |
          pnpm --filter @brix-sdk/runtime-sdk-api-web run build
          pnpm --filter @brix-sdk/runtime-sdk-api-mobile run build
          pnpm --filter @brix-sdk/runtime-sdk-react run build
          pnpm --filter @brix-sdk/shared-runtime-web run build
          pnpm --filter @brix-sdk/platform-auth-service-web run build
          pnpm --filter @brix-sdk/platform-auth-ui-web run build
          pnpm --filter @brix-sdk/platform-auth-web run build
          pnpm --filter @brix-sdk/runtime-orchestrator-web run build
          pnpm --filter @brix-sdk/runtime-manifest-web run build
          # platform-hosted-login-web's imports (standard-link plan queue item 16, 16d); ui-native's
          # declarations need the design tokens' first.
          pnpm --filter @brix-sdk/platform-design-tokens run build
          pnpm --filter @brix-sdk/infra-adapter-ui-native run build
          pnpm --filter @brix-sdk/platform-i18n-web run build
        env:
          CI: true

      # ----------------------------------------------------------------------
      # Step: Typecheck — fail-at-end so that a single broken package does
      # not hide unrelated regressions.
      # ----------------------------------------------------------------------
      - name: Typecheck
        run: |
          pnpm -r --if-present \
            --filter '!@brix-sdk/infra-adapters-workspace' \
            --filter '!@brix-sdk/platform-commons' \
            --filter '!platform-devtools' \
            --filter '!@brix-sdk/runtime-sdk-workspace' \
            --filter '!@brix-sdk/shared-runtime-workspace' \
            --filter '!@brix-sdk/infra-adapter-ui-mui' \
            --filter '!@brix-sdk/infra-adapter-ui-native' \
            run typecheck
        env:
          CI: true

  scaffold-smoke:
    name: create-brix Scaffold Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build create-brix
        run: pnpm --filter @brix-sdk/create-brix build

      - name: Generate smoke app
        run: |
          set -euo pipefail
          node packages/@brix/platform-devtools/@brix/create-brix/dist/cli.js app smoke \
            --yes \
            --skip-install \
            --skip-git \
            --no-with-ui-mobile \
            --no-with-app \
            --output-dir "$RUNNER_TEMP/create-brix-smoke"

      - name: Assert scaffold architecture
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/create-brix-smoke/app-smoke"

          test -f "$APP_DIR/pom.xml"
          test -f "$APP_DIR/smoke-api/pom.xml"
          test -f "$APP_DIR/smoke-core/pom.xml"
          test -f "$APP_DIR/smoke-server/pom.xml"
          test -f "$APP_DIR/smoke-ui-web/src/bootstrap.tsx"
          test -f "$APP_DIR/smoke-ui-web/src/repositories/SmokeRepository.ts"

          if test -d "$APP_DIR/smoke-core/src/main/java/io/brix/app/smoke/core/controller"; then
            echo "Core module must not contain a controller package."
            exit 1
          fi

          if grep -RInE '<artifactId>(spring-boot-starter-web|spring-kafka|spring-data-redis|spring-cloud-starter-openfeign|okhttp|retrofit|minio)</artifactId>' "$APP_DIR/smoke-core/pom.xml"; then
            echo "Core module contains forbidden infrastructure or web dependencies."
            exit 1
          fi

          if ! test -f "$APP_DIR/smoke-server/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports"; then
            echo "Server module must register auto-configuration through Spring Boot imports."
            exit 1
          fi

          if grep -RInE 'fetch\(|@brix-sdk/infra-adapter-ui-mui' "$APP_DIR/smoke-ui-web"; then
            echo "UI web scaffold contains direct HTTP, infra adapter, or UI library usage."
            exit 1
          fi

          if grep -RInE "from ['\"](react-router-dom|@mui/material|antd)" "$APP_DIR/smoke-ui-web"; then
            echo "UI web scaffold contains direct frontend library imports."
            exit 1
          fi

          if grep -RIn '@brix-sdk/brix' "$APP_DIR"; then
            echo "Scaffold contains legacy SDK package references."
            exit 1
          fi

          if grep -RInE '"@brix-sdk/[^"]+"\s*:\s*"\^1\.' "$APP_DIR"; then
            echo "Scaffold contains legacy 1.x Brix SDK versions."
            exit 1
          fi
