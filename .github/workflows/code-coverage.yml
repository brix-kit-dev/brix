# ============================================================================
# Code Coverage Gate (Phase 5.3)
#
# Enforces minimum 80% line coverage and 70% branch coverage on all PRs.
# Uses JaCoCo for Java (Maven) and Vitest for TypeScript (pnpm).
#
# Trigger: Pull requests to main/develop branches. The Java job, with its PostgreSQL service, also runs on pushes to
# main/develop, where most changes land without a pull request (standard-link plan L2.4, point 0), and by hand.
# ============================================================================

name: Code Coverage

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**.java'
      - '**.ts'
      - '**.tsx'
      - '**/pom.xml'
      - '**/package.json'
      - '**/vitest.config.*'
  push:
    branches: [main, develop]
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/code-coverage.yml'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== Java Coverage (JaCoCo) ==========
  java-coverage:
    name: Java Coverage (JaCoCo ≥ 80%)
    runs-on: ubuntu-latest
    # The tests that need PostgreSQL skip without BRIX_P0_POSTGRES_*: outbox claims across instances, the transport
    # conformance suites' PostgreSQL scenarios, the sample plugins end to end (standard-link plan L2.4).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: p0
          POSTGRES_PASSWORD: p0secret
          POSTGRES_DB: p0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p0 -d p0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BRIX_P0_POSTGRES_URL: jdbc:postgresql://localhost:5432/p0
      BRIX_P0_POSTGRES_USER: p0
      BRIX_P0_POSTGRES_PASSWORD: p0secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests with coverage
        run: mvn verify -Pcoverage -B --fail-at-end

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 14

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6
        with:
          paths: '**/target/site/jacoco/jacoco.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: '☂️ Java Code Coverage Report'

  # ========== TypeScript Coverage (Vitest) ==========
  ts-coverage:
    name: TypeScript Coverage (Vitest ≥ 80%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: pnpm run test:coverage || true
        env:
          CI: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: '**/coverage/'
          retention-days: 14
