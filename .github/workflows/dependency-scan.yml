# ============================================================================
# Dependency Vulnerability Scanning Workflow
# ============================================================================
#
# Phase 4.5 — CI dependency vulnerability scanning.
#
# This workflow performs two complementary scans:
#
# 1. **OWASP Dependency-Check** (scheduled + push)
#    - Scans all Maven dependencies against the NVD (National Vulnerability
#      Database) for known CVEs.
#    - Fails the build when vulnerabilities >= CVSS 7.0 (HIGH) are found.
#
# 2. **GitHub Dependency Review** (pull_request only)
#    - Reviews newly introduced dependencies in PRs and blocks merging if
#      they contain known vulnerabilities.
#
# @see v3.0.9 Architecture Review — Phase 4: Performance & Quality
# ============================================================================

name: Dependency Vulnerability Scan

on:
  push:
    branches: [main, develop]
    paths:
      - '**/pom.xml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '**/package.json'
      - '.github/workflows/dependency-scan.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: OWASP Dependency-Check for Maven (Java backend)
  # ============================================================================
  owasp-maven:
    name: OWASP Dependency-Check (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: |
          NVD_ARGS=()
          if [ -n "${NVD_API_KEY:-}" ]; then
            NVD_ARGS+=("-DnvdApiKey=${NVD_API_KEY}")
          fi

          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DfailOnError=false \
            -DsuppressionFiles=.github/owasp-suppressions.xml \
            -Dformats="HTML,JSON" \
            "${NVD_ARGS[@]}" \
            --batch-mode --no-transfer-progress \
            -pl packages/@brix/platform-commons,packages/@brix/runtime-sdk,packages/@brix/infra-adapters
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: false

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: '**/target/dependency-check-report.*'
          retention-days: 30

  # ============================================================================
  # Job 2: npm audit for frontend packages
  # ============================================================================
  npm-audit:
    name: npm Audit (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

  # ============================================================================
  # Job 3: GitHub Dependency Review (PR only)
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
