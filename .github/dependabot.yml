# Dependabot configuration for automated dependency updates.
# Version updates are turned off: open-pull-requests-limit is 0 for every
# ecosystem, so Dependabot opens no update branches or pull requests.
# Raise the limit on an entry to turn its updates back on.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Maven (Java backend) ─────────────────────────────────────
  - package-ecosystem: maven
    directory: /packages/@brix/platform-commons
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - java
    reviewers:
      - brix-platform/core-team

  - package-ecosystem: maven
    directory: /packages/@brix/runtime-sdk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - java

  - package-ecosystem: maven
    directory: /packages/@brix/infra-adapters
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - java

  # npm (frontend / website) ─────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - javascript

  # GitHub Actions ────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci
