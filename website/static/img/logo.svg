<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48">
  <defs>
    <linearGradient id="brixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(0, 4)">
    <!-- Outer shell -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#brixGradient)" stroke-width="2.5"/>
    <!-- Inner core -->
    <circle cx="20" cy="20" r="7" fill="url(#brixGradient)"/>
    <!-- Connection lines -->
    <line x1="20" y1="13" x2="20" y2="5" stroke="url(#brixGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="27" x2="20" y2="35" stroke="url(#brixGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="13" y1="20" x2="5" y2="20" stroke="url(#brixGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="27" y1="20" x2="35" y2="20" stroke="url(#brixGradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="52" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="url(#brixGradient)">Brix</text>
</svg>
