<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Outer shell (runtime) -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#brandGradient)" stroke-width="2"/>
  <!-- Inner core (plugin) -->
  <circle cx="16" cy="16" r="6" fill="url(#brandGradient)"/>
  <!-- Connection lines (capabilities) -->
  <line x1="16" y1="10" x2="16" y2="4" stroke="url(#brandGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="16" y2="28" stroke="url(#brandGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="4" y2="16" stroke="url(#brandGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="28" y2="16" stroke="url(#brandGradient)" stroke-width="2" stroke-linecap="round"/>
</svg>
