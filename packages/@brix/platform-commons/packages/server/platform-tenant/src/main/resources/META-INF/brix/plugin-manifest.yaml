apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: platform-tenant
  name: platform-tenant
  version: 3.2.0
  displayName: Platform Tenant Data Owner
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.0.10 <4.0.0"
modules:
  # The contract of TenantReferenceQuery; other plugins depend on it, never on platform-tenant (root BRX-RS-LIFE-010).
  - groupId: io.brix.platform
    artifactId: platform-tenant-api
    version: 3.2.0
    moduleKind: plugin-api
  - groupId: io.brix.platform
    artifactId: platform-tenant
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides:
    - endpointId: platform-tenant.first-owner.accept.v1
      transport: http
      method: POST
      path: /api/tenant/first-owner-invitations/accept
      request:
        schemaRef: brix://schemas/platform-tenant/accept-first-owner-invitation-request/1.0.0
      response:
        schemaRef: brix://schemas/platform-tenant/first-owner-acceptance/1.0.0
      handlerId: platform-tenant.first-owner.accept.v1
      authentication:
        mode: required
      authorization:
        policyRef: tenant:first-owner:accept
      tenantContext:
        mode: forbidden
        # The invitation token resolves the tenant (BRX-TENANT-ENTRY-005, multi-tenant §6.4).
        sourcePolicyRef: first-owner-invitation-resolution
      timeout:
        policyRef: interactive-write
      # BRX-TENANT-ENTRY-005: the caller names a key, and the runtime replays the answer of an acceptance that went
      # through (root BRX-RS-MANIFEST-018; standard-link plan point 10b-1).
      idempotency:
        mode: required
    # The calling staff member's context and effective permissions for the BFF session
    # (multi-tenant 5.1 BRX-TENANT-AUTHZ-009); every staff role holds tenant:profile:read.
    - endpointId: platform-tenant.session.v1
      transport: http
      method: GET
      path: /api/tenant/session
      request:
        schemaRef: brix://schemas/platform-tenant/tenant-session-request/1.0.0
      response:
        schemaRef: brix://schemas/platform-tenant/tenant-session/1.0.0
      handlerId: platform-tenant.session.v1
      authentication:
        mode: required
        policyRef: tenant-actor
      authorization:
        permissions:
          - tenant:profile:read
        decision: all
        resourcePolicyRef: platform-tenant-session-read
      tenantContext:
        mode: required
        source: runtime
      timeout:
        policyRef: endpoint-default
      idempotency:
        mode: not-applicable
capabilities:
  required:
    - id: io.runtime.sdk.capability.EventBusCapability
      version: ">=3.0.10 <4.0.0"
    - id: io.runtime.sdk.capability.PersistenceCapability
      version: ">=3.2.0 <4.0.0"
  optional:
    - id: io.brix.platform.tenant.internal.TenantAdministration
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.NotificationCapability
      version: ">=3.2.0 <4.0.0"
# TenantReferenceQuery (multi-tenant §7.1, BRX-TENANT-CONTRACT-003, T-7): plugins check the member and principal ids
# they store through it; its contract and generated types ship in platform-tenant-api (query design Q10).
queries:
  provides:
    - queryType: platform-tenant.tenant-reference
      request:
        schemaRef: brix://schemas/platform-tenant/tenant-reference-query/1.0.0
      response:
        schemaRef: brix://schemas/platform-tenant/tenant-reference/1.0.0
      handlerId: platform-tenant.tenant-reference.v1
      # In the caller's tenant, for any plugin that declares it: the answer says only whether an id is an active
      # member or principal there, with no personal data.
      scopePolicyRef: query-caller-tenant
      accessPolicyRef: declared-consumers
      timeoutPolicyRef: query-interactive
      concurrencyPolicyRef: query-standard
  consumes: []
commands:
  provides: []
  consumes: []
events:
  publishes:
    - eventType: TenantFirstOwnerAccepted
      schemaRef: brix://schemas/platform-tenant/tenant-first-owner-accepted/1.0.0
      version: 1.0.0
      reliability: CRITICAL
  subscribes:
    - subscriptionId: tenant-first-owner-projection
      eventType: TenantFirstOwnerAccepted
      schemaRange: ">=1.0.0 <2.0.0"
      handlerId: tenant-first-owner-projection.v1
      scopePolicyRef: tenant-first-owner-projection-scope
      publisherPolicyRef: platform-tenant-owner
      timeoutPolicyRef: event-standard
      concurrencyPolicyRef: partition-serial
      retryPolicyRef: event-standard
      idempotencyPolicyRef: persistent-inbox
    # Delivered from platform_identity_outbox after the identity owner commits (P4 design §4.3); the
    # runtime scopes it to that identity's pending FIRST_OWNER invitations (multi-tenant §6.4) and
    # records (handlerId, eventId) in platform_tenant_inbox, so a redelivered fact resends nothing twice.
    - subscriptionId: first-owner-invitee-setup
      eventType: FirstOwnerInviteeSetupCompleted
      schemaRange: ">=1.0.0 <2.0.0"
      handlerId: first-owner-invitee-setup.v1
      scopePolicyRef: first-owner-invitee-setup-fanout
      publisherPolicyRef: platform-identity-owner
      timeoutPolicyRef: event-standard
      concurrencyPolicyRef: partition-serial
      retryPolicyRef: event-standard
      idempotencyPolicyRef: persistent-inbox
tasks:
  provides: []
internalContracts:
  provides:
    - contractId: brix.internal.tenant.administration
      contractType: io.brix.platform.tenant.internal.TenantAdministration
      contractVersion: 1.1.0
      providerId: platform-tenant.internal.tenant-administration
      owner: platform-tenant
      # The operational endpoints that write through these methods have their results replayed: the runtime keeps each
      # method's result in this plugin's table, with the write. None holds a secret or credential (idempotency design D79).
      replayableWrites:
        - createPendingTenant
        - createFirstOwnerInvitation
data:
  storageId: platform_tenant
  schema: platform-tenant
  migrationLocation: db/migration/platform-tenant
  outbox: platform_tenant_outbox
  inbox: platform_tenant_inbox
permissions:
  - id: platform:tenant:create
  - id: platform:tenant:first-owner-invite
  - id: tenant:first-owner:accept
  - id: tenant:profile:read
    name: Read tenant profile
    description: Allows reading the basic information of the current tenant.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
      - {role: MEMBER, scope: TENANT}
  - id: tenant:member:read
    name: Read tenant members
    description: Allows reading tenant members; MEMBER sees only its own record.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
      - {role: MEMBER, scope: SELF}
  - id: tenant:member:invite
    name: Invite tenant members
    description: Allows inviting members and resending or revoking member invitations.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
  - id: tenant:member:update-role
    name: Change member role
    description: Allows changing a member between ADMIN and MEMBER.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
  - id: tenant:member:disable
    name: Disable tenant members
    description: Allows disabling and restoring members.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
  - id: tenant:member:reset-mfa
    name: Reset member MFA
    description: Allows resetting the MFA factors of a member after re-verification (BRX-TENANT-AUTH-002).
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
  - id: tenant:owner:transfer
    name: Transfer tenant ownership
    description: Allows appointing an OWNER and transferring ownership (T-18).
    grants:
      - {role: OWNER, scope: TENANT}
  - id: tenant:security:update
    name: Update tenant security settings
    description: Allows changing mfa_policy and other security settings (BRX-TENANT-AUTH-001).
    grants:
      - {role: OWNER, scope: TENANT}
  - id: tenant:audit:read
    name: Read tenant audit
    description: Allows reading the tenant audit log.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
config: []
ui:
  web:
    enabled: false
