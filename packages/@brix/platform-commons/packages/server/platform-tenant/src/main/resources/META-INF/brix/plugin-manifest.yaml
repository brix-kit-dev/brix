apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: platform-tenant
  name: platform-tenant
  version: 3.2.0
  displayName: Platform Tenant Data Owner
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.0.10 <4.0.0"
modules:
  - groupId: io.brix.platform
    artifactId: platform-tenant
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides:
    - endpointId: platform-tenant.first-owner.accept.v1
      transport: http
      method: POST
      path: /api/tenant/first-owner-invitations/accept
      request:
        schemaRef: brix://schemas/platform-tenant/accept-first-owner-invitation-request/1.0.0
      response:
        schemaRef: brix://schemas/platform-tenant/first-owner-acceptance/1.0.0
      handlerId: platform-tenant.first-owner.accept.v1
      authentication:
        mode: required
      authorization:
        policyRef: tenant:first-owner:accept
      tenantContext:
        mode: forbidden
      timeout:
        policyRef: interactive-write
      idempotency:
        mode: required
capabilities:
  required:
    - id: io.runtime.sdk.capability.EventBusCapability
      version: ">=3.0.10 <4.0.0"
  optional:
    - id: io.runtime.sdk.capability.NotificationCapability
      version: ">=3.2.0 <4.0.0"
queries:
  provides: []
  consumes: []
commands:
  provides: []
  consumes: []
events:
  publishes:
    - eventType: TenantFirstOwnerAccepted
      schemaRef: brix://schemas/platform-tenant/tenant-first-owner-accepted/1.0.0
      version: 1.0.0
      reliability: CRITICAL
  subscribes:
    - subscriptionId: tenant-first-owner-projection
      eventType: TenantFirstOwnerAccepted
      schemaRange: ">=1.0.0 <2.0.0"
      handlerId: tenant-first-owner-projection.v1
      scopePolicyRef: tenant-first-owner-projection-scope
      publisherPolicyRef: platform-tenant-owner
      timeoutPolicyRef: event-standard
      concurrencyPolicyRef: tenant-first-owner-projection
      retryPolicyRef: event-standard
      idempotencyPolicyRef: persistent-inbox
tasks:
  provides: []
internalContracts:
  provides:
    - contractId: brix.internal.tenant.administration
      contractType: io.brix.platform.tenant.internal.TenantAdministration
      contractVersion: 1.0.0
      providerId: platform-tenant.internal.tenant-administration
      owner: platform-tenant
    - contractId: brix.internal.platform.bootstrap-administration
      contractType: io.brix.platform.tenant.internal.PlatformBootstrapAdministration
      contractVersion: 1.0.0
      providerId: platform-tenant.internal.bootstrap-administration
      owner: platform-tenant
    - contractId: brix.internal.platform.identity-administration
      contractType: io.brix.platform.tenant.internal.PlatformIdentityAdministration
      contractVersion: 1.0.0
      providerId: platform-tenant.internal.identity-administration
      owner: platform-tenant
data:
  storageId: platform_tenant
  schema: platform-tenant
  migrationLocation: db/migration/platform-tenant
  outbox: platform_tenant_outbox
  inbox: platform_tenant_inbox
permissions:
  - id: platform:tenant:create
  - id: platform:tenant:first-owner-invite
  - id: tenant:first-owner:accept
config: []
ui:
  web:
    enabled: false
