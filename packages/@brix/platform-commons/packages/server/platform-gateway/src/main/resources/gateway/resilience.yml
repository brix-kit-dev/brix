# ==========================================================================
# Gateway 弹性保护配置
#
# P101: 限流（RateLimiter）、熔断（CircuitBreaker）、并发隔离（Bulkhead）
# M002: HTTP/Redis 显式超时与有限重试
# ==========================================================================

gateway:
  # ========== 限流配置（RateLimiter）==========
  # 基于滑动窗口算法控制 QPS
  ratelimit:
    enabled: ${GATEWAY_RATELIMIT_ENABLED:true}
    default-config:
      # 每个刷新周期允许的请求数（QPS）
      limit-for-period: ${GATEWAY_RATELIMIT_QPS:100}
      # 刷新周期（ISO-8601 格式：PT1S=1秒）
      limit-refresh-period: PT1S
      # 获取许可超时（PT0S=立即拒绝）
      timeout-duration: PT0S
    routes:
      # 插件引擎路由单独配置
      plugin-engine:
        limit-for-period: ${GATEWAY_RATELIMIT_ENGINE_QPS:200}
        limit-refresh-period: PT1S
        timeout-duration: PT0S
      # 用户插件路由
      plugin-user-register:
        limit-for-period: ${GATEWAY_RATELIMIT_USER_QPS:100}
        limit-refresh-period: PT1S
        timeout-duration: PT0S

  # ========== 熔断器配置（CircuitBreaker）==========
  # 基于失败率/慢调用率触发熔断
  circuitbreaker:
    enabled: ${GATEWAY_CIRCUITBREAKER_ENABLED:true}
    default-config:
      # 失败率阈值（%），超过此值触发熔断
      failure-rate-threshold: ${GATEWAY_CB_FAILURE_RATE:50}
      # 慢调用率阈值（%），100表示不基于慢调用熔断
      slow-call-rate-threshold: 100
      # 慢调用时间阈值
      slow-call-duration-threshold: PT5S
      # 滑动窗口类型：COUNT_BASED（基于调用次数）/ TIME_BASED（基于时间）
      sliding-window-type: COUNT_BASED
      # 滑动窗口大小
      sliding-window-size: ${GATEWAY_CB_WINDOW_SIZE:10}
      # 触发熔断计算的最小调用次数
      minimum-number-of-calls: ${GATEWAY_CB_MIN_CALLS:5}
      # 熔断器打开后的等待时间（进入半开状态前）
      wait-duration-in-open-state: PT10S
      # 半开状态允许的试探调用次数
      permitted-number-of-calls-in-half-open-state: 3
      # 是否自动从打开状态转换到半开状态
      automatic-transition-from-open-to-half-open-enabled: true
    routes:
      plugin-engine:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: PT10S
        permitted-number-of-calls-in-half-open-state: 3

  # ========== 并发隔离配置（Bulkhead）==========
  # 限制同时进行中的请求数量
  bulkhead:
    enabled: ${GATEWAY_BULKHEAD_ENABLED:true}
    default-config:
      # 最大并发调用数
      max-concurrent-calls: ${GATEWAY_BULKHEAD_MAX_CONCURRENT:25}
      # 等待获取许可的最大时间（PT0S=立即拒绝）
      max-wait-duration: PT0S
    routes:
      plugin-engine:
        max-concurrent-calls: ${GATEWAY_BULKHEAD_ENGINE_MAX_CONCURRENT:50}
        max-wait-duration: PT0S
      plugin-user-register:
        max-concurrent-calls: ${GATEWAY_BULKHEAD_USER_MAX_CONCURRENT:25}
        max-wait-duration: PT0S

  # ========== 弹性配置（M002: 超时与重试）==========
  # MVP 红线要求：Redis/HTTP 显式超时；有限重试（最多 3 次）
  resilience:
    # HTTP 下游调用超时配置
    http:
      enabled: ${GATEWAY_HTTP_RESILIENCE_ENABLED:true}
      # TCP 连接超时（毫秒）
      connect-timeout-ms: ${GATEWAY_HTTP_CONNECT_TIMEOUT_MS:5000}
      # 响应超时（毫秒）
      response-timeout-ms: ${GATEWAY_HTTP_RESPONSE_TIMEOUT_MS:30000}
      # 全局超时（毫秒），包含重试
      global-timeout-ms: ${GATEWAY_HTTP_GLOBAL_TIMEOUT_MS:60000}
      # 读取超时（毫秒）
      read-timeout-ms: ${GATEWAY_HTTP_READ_TIMEOUT_MS:30000}
      # 写入超时（毫秒）
      write-timeout-ms: ${GATEWAY_HTTP_WRITE_TIMEOUT_MS:30000}
    
    # 重试策略配置
    retry:
      enabled: ${GATEWAY_RETRY_ENABLED:true}
      # 最大重试次数（MVP 红线：最多 3 次）
      max-attempts: ${GATEWAY_RETRY_MAX_ATTEMPTS:3}
      # 初始退避时间（毫秒）
      initial-backoff-ms: ${GATEWAY_RETRY_INITIAL_BACKOFF_MS:500}
      # 最大退避时间（毫秒）
      max-backoff-ms: ${GATEWAY_RETRY_MAX_BACKOFF_MS:5000}
      # 退避乘数
      multiplier: ${GATEWAY_RETRY_MULTIPLIER:2.0}
      # 是否启用随机抖动
      jitter-enabled: ${GATEWAY_RETRY_JITTER_ENABLED:true}
      # 抖动因子
      jitter-factor: ${GATEWAY_RETRY_JITTER_FACTOR:0.5}
      # 是否对连接失败重试
      retry-on-connection-failure: true
      # 是否对超时重试
      retry-on-timeout: true
    
    # Redis 弹性配置
    redis:
      enabled: ${GATEWAY_REDIS_RESILIENCE_ENABLED:true}
      # 命令超时（毫秒）
      command-timeout-ms: ${GATEWAY_REDIS_COMMAND_TIMEOUT_MS:5000}
      # 连接超时（毫秒）
      connect-timeout-ms: ${GATEWAY_REDIS_CONNECT_TIMEOUT_MS:5000}
      # 最大重试次数
      max-attempts: ${GATEWAY_REDIS_MAX_ATTEMPTS:3}
      # 重试初始延迟（毫秒）
      retry-initial-delay-ms: ${GATEWAY_REDIS_RETRY_INITIAL_DELAY_MS:200}
      # 重试最大延迟（毫秒）
      retry-max-delay-ms: ${GATEWAY_REDIS_RETRY_MAX_DELAY_MS:2000}
      # 是否自动重连
      auto-reconnect: true
      # 连接池配置
      min-idle-connections: ${GATEWAY_REDIS_POOL_MIN_IDLE:5}
      max-connections: ${GATEWAY_REDIS_POOL_MAX:50}
