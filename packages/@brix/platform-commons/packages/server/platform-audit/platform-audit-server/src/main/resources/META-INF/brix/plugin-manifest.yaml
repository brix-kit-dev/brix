# Platform audit Data Owner (super-admin 4.0.1 §1.3a, §2.1): sole owner of sys_platform_audit_log.
apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: platform-audit
  name: platform-audit
  version: 3.2.0
  displayName: Platform Audit Data Owner
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.0.10 <4.0.0"
modules:
  - groupId: io.brix.platform
    artifactId: platform-audit-api
    version: 3.2.0
    moduleKind: plugin-api
  - groupId: io.brix.platform
    artifactId: platform-audit-core
    version: 3.2.0
    moduleKind: plugin-core
  - groupId: io.brix.platform
    artifactId: platform-audit-server
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides: []
capabilities:
  required:
    - id: io.runtime.sdk.capability.PersistenceCapability
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.IdGeneratorCapability
      version: ">=3.2.0 <4.0.0"
  optional: []
queries:
  provides: []
  consumes: []
commands:
  provides: []
  consumes: []
events:
  publishes: []
  subscribes:
    # platform-identity's audit facts (P4 design §4.2, D14): delivered after the identity transaction
    # commits; the runtime records (handlerId, eventId) in platform_audit_inbox in the same unit of work
    # as the record. PLATFORM events bind no tenant; the blueprint registers no policy id for that yet.
    - subscriptionId: identity-audit-fact
      eventType: IdentityAuditFactRecorded
      schemaRange: ">=1.0.0 <2.0.0"
      handlerId: identity-audit-fact-record.v1
      scopePolicyRef: identity-audit-fact-scope
      publisherPolicyRef: platform-identity-owner
      timeoutPolicyRef: event-standard
      concurrencyPolicyRef: identity-audit-fact
      retryPolicyRef: event-standard
      idempotencyPolicyRef: persistent-inbox
tasks:
  provides: []
internalContracts:
  provides:
    - contractId: brix.internal.platform.audit
      contractType: io.brix.platform.audit.internal.PlatformAuditAdministration
      contractVersion: 1.1.0
      providerId: platform-audit.internal.audit-administration
      owner: platform-audit
data:
  storageId: platform_audit
  schema: platform-audit
  migrationLocation: db/migration/platform-audit
  inbox: platform_audit_inbox
  # Root BRX-RS-DATA-045, DATA-047: the runtime policy audit writer may only insert these columns, for
  # the two cross-tenant policy actions; V002's checks enforce the same rule in the database.
  custodialWrites:
    - table: sys_platform_audit_log
      custodian: runtime.tenant-policy-audit
      operations: [INSERT]
      columns:
        - id
        - operator_identity_id
        - action
        - resource_type
        - resource_id
        - affected_tenants
        - context
        - success
        - error_code
        - execution_identity
        - reason_code
        - trace_id
        - source_ip
        - user_agent
        - writer
      actions: [LOGIN_TENANT_DISCOVERY, FIRST_OWNER_INVITEE_SETUP_FANOUT]
      recordSchemaRef: "brix://schemas/platform-audit/policy-use-record/1.0.0"
permissions: []
config: []
ui:
  web:
    enabled: false
