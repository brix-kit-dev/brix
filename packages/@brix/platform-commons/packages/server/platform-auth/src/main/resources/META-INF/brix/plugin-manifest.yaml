apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: platform-auth
  name: platform-auth
  version: 3.2.0
  displayName: Platform Auth
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.0.10 <4.0.0"
modules:
  # The stable platform role and permission IDs (super-admin 4.0.1 §4). platform-admin names them from here: an
  # operational module never depends on this plugin's implementation.
  - groupId: io.brix.platform
    artifactId: platform-auth-api
    version: 3.2.0
    moduleKind: plugin-api
  - groupId: io.brix.platform
    artifactId: platform-auth
    version: 3.2.0
    moduleKind: plugin-server
# No endpoint: staff sign in through the hosted login of the identity protocol surface, and no
# entry takes a password and returns tokens (identity-auth IA-1, M1 slice 3).
endpoints:
  provides: []
capabilities:
  required: []
  optional: []
queries:
  provides: []
  consumes: []
commands:
  provides: []
  consumes: []
events:
  publishes: []
  subscribes: []
tasks:
  provides: []
internalContracts:
  provides: []
# Google's signing keys for "Sign in with Google" (standard-link plan L8.5). The host's directory gives the address:
# brix.external-services.google-oauth-jwks.base-url, normally https://www.googleapis.com.
externalServices:
  - id: google-oauth-jwks
    baseUrlRef: google-oauth-jwks
    authPolicyRef: none
    timeoutPolicyRef: external-default
    retryPolicyRef: external-idempotent-retry
    concurrencyPolicyRef: external-standard
data:
  storageId: platform_auth
  schema: platform-auth
  migrationLocation: db/migration/platform-auth
permissions: []
config: []
ui:
  web:
    enabled: false
