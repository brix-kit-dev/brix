apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: platform-identity
  name: platform-identity
  version: 3.2.0
  displayName: Platform Identity Data Owner
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.0.10 <4.0.0"
modules:
  - groupId: io.brix.platform
    artifactId: platform-identity
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides: []
capabilities:
  required:
    - id: io.runtime.sdk.capability.EventBusCapability
      version: ">=3.0.10 <4.0.0"
    - id: io.runtime.sdk.capability.PersistenceCapability
      version: ">=3.2.0 <4.0.0"
  optional: []
queries:
  provides: []
  consumes: []
commands:
  provides: []
  consumes: []
events:
  # Written to platform_identity_outbox in the identity transaction (P4 design §4.1). The audit fact
  # is published from P4c on, the invitee setup from P4d on.
  publishes:
    - eventType: IdentityAuditFactRecorded
      schemaRef: brix://schemas/platform-identity/identity-audit-fact/1.0.0
      version: 1.0.0
      reliability: CRITICAL
    - eventType: FirstOwnerInviteeSetupCompleted
      schemaRef: brix://schemas/platform-identity/first-owner-invitee-setup-completed/1.0.0
      version: 1.0.0
      reliability: CRITICAL
  subscribes: []
tasks:
  provides: []
internalContracts:
  provides:
    - contractId: brix.internal.platform.bootstrap-administration
      contractType: io.brix.platform.identity.internal.PlatformBootstrapAdministration
      # 2.0.0 (standard-link plan point 10b-7a): the first admin is created for the runtime-verified bootstrap session.
      contractVersion: 2.0.0
      providerId: platform-identity.internal.bootstrap-administration
      owner: platform-identity
      # The bootstrap endpoint that writes through this method has its results replayed: the runtime keeps the result in
      # this plugin's table, with the write. It holds ids and a delivery marker, no secret or credential (idempotency
      # design D79; standard-link plan point 10b-7).
      replayableWrites:
        - createFirstAdmin
    - contractId: brix.internal.platform.identity-administration
      contractType: io.brix.platform.identity.internal.PlatformIdentityAdministration
      contractVersion: 1.0.0
      providerId: platform-identity.internal.identity-administration
      owner: platform-identity
data:
  storageId: platform_identity
  schema: platform-identity
  migrationLocation: db/migration/platform-identity
  outbox: platform_identity_outbox
  inbox: platform_identity_inbox
permissions: []
config: []
ui:
  web:
    enabled: false
