# ============================================================================
# Brix UI Manifest Schema
# ============================================================================
# ACTIVE Frontend 1.1 schema for governed UI artifacts. The UI Manifest is
# consumed by Runtime/Host composition and must be checked against routes,
# permissions, exports, shared runtime, and declared escape hatches.
#
# Applies to: ui-web/ui-mobile artifacts and platform-commons operational UI
# Version: 1.1
# ============================================================================

type: object
additionalProperties: false
required:
  - schemaVersion
  - module
  - runtime
  - requiredHostCapabilities
  - permissions
  - routes
properties:
  schemaVersion:
    type: string
    enum: [brix.ui-manifest.v1]

  module:
    type: object
    additionalProperties: false
    required: [moduleId, packageName, moduleKind, owner, version]
    properties:
      moduleId:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
      packageName:
        type: string
        minLength: 1
      moduleKind:
        type: string
        enum: [ui-web, ui-mobile, platform-operational-ui]
      owner:
        type: string
        minLength: 1
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\\+[0-9A-Za-z][0-9A-Za-z.-]*)?$"

  runtime:
    type: object
    additionalProperties: false
    required: [rootBlueprint, frontendBlueprint, sharedRuntimeRange]
    properties:
      rootBlueprint:
        type: string
        enum: [runtime-shell-3.0.10]
      frontendBlueprint:
        type: string
        enum: [frontend-1.1]
      sharedRuntimeRange:
        type: string
        minLength: 1

  requiredHostCapabilities:
    type: array
    uniqueItems: true
    items:
      type: string
      enum: [auth, http, i18n, router, theme, ui]

  permissions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [permissionId, description]
      properties:
        permissionId:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1

  routes:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - routeId
        - pageId
        - path
        - title
        - componentExport
        - guardPolicy
        - authContext
        - tenantContext
        - permissions
        - requiredHostCapabilities
        - referrerPolicy
      properties:
        routeId:
          type: string
          minLength: 1
        pageId:
          type: string
          minLength: 1
        path:
          type: string
          pattern: "^/"
        title:
          type: string
          minLength: 1
        componentExport:
          type: string
          minLength: 1
        guardPolicy:
          type: string
          enum: [bootstrap-only, platform-authenticated, public, setup-only, subject-authenticated]
        authContext:
          type: string
          enum: [anonymous, bootstrap-setup, platform, actor, subject]
        tenantContext:
          type: string
          enum: [forbidden, required, optional]
        permissions:
          type: array
          items:
            type: string
        requiredHostCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [auth, http, i18n, router, theme, ui]
        referrerPolicy:
          type: string
          enum: [no-referrer, strict-origin-when-cross-origin]

  menus:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [menuId, title, icon, order]
      properties:
        menuId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        icon:
          type: string
          minLength: 1
        order:
          type: integer
        pageId:
          type: string
        permission:
          type: string

  sharedRuntime:
    type: object
    additionalProperties: false
    properties:
      singleton:
        type: array
        uniqueItems: true
        items:
          type: string

  escapeHatches:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [packageName, owner, reason, risk, expiresAt, approver]
      properties:
        packageName:
          type: string
          minLength: 1
        owner:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        risk:
          type: string
          minLength: 1
        expiresAt:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        approver:
          type: string
          minLength: 1
