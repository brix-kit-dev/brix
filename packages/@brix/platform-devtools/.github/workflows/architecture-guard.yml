# ============================================================================
# Architecture Guard CI - Comprehensive Architecture Validation
# ============================================================================
#
# This CI pipeline enforces architectural rules from the Architecture Review
# Checklist (附录C). Applicable checks for platform-devtools are implemented here.
#
# ============================================================================
# 附录C 可 CI 化检查项对照表
# ============================================================================
#
# | ID        | Check                              | Implementation      |
# |-----------|------------------------------------|--------------------|
# | R1.1-R1.4 | ArchUnit rules library test        | Maven test         |
# | R7.1-R7.2 | ESLint config validation           | ESLint test        |
# | BP3/OS9   | Build artifacts not in Git         | git ls-files       |
# | BP4/OS1   | Secret leak detection              | gitleaks           |
# | RM1       | No .class files in source dirs     | find check         |
#
# 【DevTools Responsibilities】
# - Architecture guard rules library (ArchUnit / ESLint)
# - Design tokens
# - Code generation tools (create-brix)
# ============================================================================

name: Architecture Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ========================================
  # 🔐 BP4/OS1: Secret Leak Detection
  # ========================================
  secret-scan:
    name: Secret Leak Scan (BP4/OS1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ========================================
  # 📦 BP3/OS9: Build Artifacts Check
  # ========================================
  build-artifacts-check:
    name: Build Artifacts Not in Git (BP3/OS9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for committed build artifacts
        run: |
          echo "🔍 Checking for committed build artifacts..."
          
          found=false
          
          DIST_FILES=$(git ls-files | grep -E "^dist/|/dist/" || true)
          if [ -n "$DIST_FILES" ]; then
            echo "❌ Found dist/ files committed to Git"
            found=true
          fi
          
          TARGET_FILES=$(git ls-files | grep -E "^target/|/target/" || true)
          if [ -n "$TARGET_FILES" ]; then
            echo "❌ Found target/ files committed to Git"
            found=true
          fi
          
          if [ "$found" = true ]; then
            exit 1
          else
            echo "✅ No build artifacts found in Git"
          fi

  # ========================================
  # ☕ RM1: No .class Files in Source
  # ========================================
  class-files-check:
    name: No .class in Source (RM1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for .class files in source directories
        run: |
          echo "🔍 Checking for .class files in source directories..."
          
          CLASS_FILES=$(find . -path "*/src/*" -name "*.class" -type f ! -path "*/target/*" 2>/dev/null || true)
          
          if [ -n "$CLASS_FILES" ]; then
            echo "❌ Found .class files in source directories:"
            echo "$CLASS_FILES"
            exit 1
          else
            echo "✅ No .class files found in source directories"
          fi

  # ========================================
  # ArchUnit 规则库测试
  # ========================================
  archunit-tests:
    name: ArchUnit Rules Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run ArchUnit Tests
        working-directory: architecture-guard
        run: |
          echo "🔍 运行 ArchUnit 规则自身测试..."
          mvn test -B
          
      - name: Verify Rule Coverage
        working-directory: architecture-guard
        run: |
          echo "🔍 验证规则覆盖完整性..."
          
          # 检查 PluginProfile 是否包含全部 8 条红线
          PLUGIN_RULES=$(grep -c "@ArchTest" src/main/java/io/brix/architecture/guard/profiles/PluginProfile.java || true)
          
          echo "PluginProfile 规则数量: $PLUGIN_RULES"
          
          if [ "$PLUGIN_RULES" -lt 13 ]; then
            echo "⚠️  PluginProfile 规则数量不足，请检查是否覆盖全部红线"
          else
            echo "✅ PluginProfile 规则覆盖充分"
          fi
          
          # 检查 HostProfile 规则数量
          HOST_RULES=$(grep -c "@ArchTest" src/main/java/io/brix/architecture/guard/profiles/HostProfile.java || true)
          
          echo "HostProfile 规则数量: $HOST_RULES"
          
          if [ "$HOST_RULES" -lt 10 ]; then
            echo "⚠️  HostProfile 规则数量不足，请检查超薄原则规则"
          else
            echo "✅ HostProfile 规则覆盖充分"
          fi

  # ========================================
  # ESLint 配置验证
  # ========================================
  eslint-config-test:
    name: ESLint Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate ESLint Config Syntax
        working-directory: eslint-config-architecture
        run: |
          echo "🔍 验证 ESLint 配置语法..."
          
          # 使用 Node.js 验证配置是否可正确加载
          node -e "
            const config = require('./index.js');
            if (!Array.isArray(config)) {
              console.error('❌ ESLint 配置应该导出数组');
              process.exit(1);
            }
            console.log('✅ ESLint 配置语法正确');
            console.log('  配置块数量:', config.length);
            config.forEach((c, i) => {
              console.log('  [' + i + '] name:', c.name || '(unnamed)');
            });
          "

      - name: Check Rule Coverage
        working-directory: eslint-config-architecture
        run: |
          echo "🔍 检查 ESLint 规则覆盖..."
          
          # 检查红线覆盖
          if grep -q "infra-adapter" index.js; then
            echo "✅ 红线1: 基础设施适配器检查 - 已覆盖"
          else
            echo "❌ 红线1: 基础设施适配器检查 - 未覆盖"
          fi
          
          if grep -q "kafkajs\|ioredis\|amqplib" index.js; then
            echo "✅ 红线2: 中间件客户端检查 - 已覆盖"
          else
            echo "❌ 红线2: 中间件客户端检查 - 未覆盖"
          fi
          
          if grep -q "axios\|fetch" index.js; then
            echo "✅ 红线3: HTTP 客户端检查 - 已覆盖"
          else
            echo "❌ 红线3: HTTP 客户端检查 - 未覆盖"
          fi
          
          if grep -q "localStorage\|sessionStorage" index.js; then
            echo "✅ 红线6: 本地存储检查 - 已覆盖"
          else
            echo "❌ 红线6: 本地存储检查 - 未覆盖"
          fi
          
          if grep -q "no-console" index.js; then
            echo "✅ 红线7: Console 检查 - 已覆盖"
          else
            echo "❌ 红线7: Console 检查 - 未覆盖"
          fi
          
          if grep -q "EventEmitter\|events" index.js; then
            echo "✅ 红线8: EventEmitter 检查 - 已覆盖"
          else
            echo "❌ 红线8: EventEmitter 检查 - 未覆盖"
          fi

  # ========================================
  # 设计令牌验证
  # ========================================
  design-tokens-test:
    name: Design Tokens Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Design Tokens
        run: |
          echo "🔍 验证设计令牌..."
          
          if [ -d "@brix/design-tokens" ]; then
            cd "@brix/design-tokens"
            
            # 检查必要的令牌文件
            REQUIRED_FILES="tokens.json breakpoints colors spacing typography"
            
            for f in $REQUIRED_FILES; do
              if [ -f "$f.json" ] || [ -f "src/$f.ts" ] || [ -f "src/$f.json" ]; then
                echo "✅ $f 令牌已定义"
              else
                echo "⚠️  $f 令牌可能未定义"
              fi
            done
          else
            echo "⚠️  @brix/design-tokens 目录不存在"

  # ========================================
  # 📋 Architecture Guard Summary
  # ========================================
  guard-summary:
    name: Architecture Guard Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, build-artifacts-check, class-files-check, archunit-tests, eslint-config-test]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "============================================"
          echo "Architecture Guard - 附录C 检查结果汇总"
          echo "============================================"
          echo ""
          echo "| Check ID   | Job                     | Status |"
          echo "|------------|-------------------------|--------|"
          echo "| BP4/OS1    | Secret Leak Scan        | ${{ needs.secret-scan.result }} |"
          echo "| BP3/OS9    | Build Artifacts Check   | ${{ needs.build-artifacts-check.result }} |"
          echo "| RM1        | No .class in Source     | ${{ needs.class-files-check.result }} |"
          echo "| R1.1-R1.4  | ArchUnit Rules Test     | ${{ needs.archunit-tests.result }} |"
          echo "| R7.1-R7.2  | ESLint Config Test      | ${{ needs.eslint-config-test.result }} |"
          echo ""
          
          # Check if any job failed
          if [ "${{ needs.secret-scan.result }}" = "failure" ] || \
             [ "${{ needs.build-artifacts-check.result }}" = "failure" ] || \
             [ "${{ needs.class-files-check.result }}" = "failure" ] || \
             [ "${{ needs.archunit-tests.result }}" = "failure" ] || \
             [ "${{ needs.eslint-config-test.result }}" = "failure" ]; then
            echo "❌ Some architecture checks failed. Please fix before merging."
            exit 1
          else
            echo "✅ All architecture checks passed!"
          fi
          fi
