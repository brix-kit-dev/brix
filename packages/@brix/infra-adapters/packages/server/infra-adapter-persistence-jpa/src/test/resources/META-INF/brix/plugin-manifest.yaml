apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: test-owner
  name: test-owner
  version: 3.2.0
  displayName: Persistence Adapter Test Owner
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.0.10 <4.0.0"
modules:
  - groupId: io.brix
    artifactId: infra-adapter-persistence-jpa
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides: []
capabilities:
  required:
    - id: io.runtime.sdk.capability.EventBusCapability
      version: ">=3.0.10 <4.0.0"
    - id: io.runtime.sdk.capability.PersistenceCapability
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.CommandCapability
      version: ">=3.0.10 <4.0.0"
  optional: []
queries:
  provides: []
  consumes: []
commands:
  provides: []
  # OwnerCommandBusTest: a command the owner submits.
  consumes:
    - commandType: ReserveStock
      versionRange: ">=1.1.0 <2.0.0"
      required: false
events:
  # OwnerOutboxEventBusTest: what the owner's outbox accepts.
  publishes:
    - eventType: MemberAccepted
      schemaRef: brix://schemas/test-owner/member-accepted/1.0.0
      version: 1.2.0
      reliability: CRITICAL
    - eventType: Heartbeat
      schemaRef: brix://schemas/test-owner/heartbeat/1.0.0
      version: 1.0.0
      reliability: BEST_EFFORT
  subscribes: []
tasks:
  provides: []
internalContracts:
  provides: []
data:
  storageId: test_owner
  schema: test-owner
  migrationLocation: db/migration/test-owner
  # OwnerOutboxEventBusTest: the owner's outbox.
  outbox: test_owner_outbox
  # JdbcEventInboxStoreTest: the owner's persistent event inbox.
  inbox: test_owner_inbox
  # JdbcPolicyAuditWriterTest: covers login-time discovery only, so the other audited policy is uncovered.
  custodialWrites:
    - table: test_policy_audit
      custodian: runtime.tenant-policy-audit
      operations: [INSERT]
      columns: [id, operator_identity_id, action, resource_type, resource_id, affected_tenants, context, success,
                error_code, execution_identity, reason_code, trace_id, source_ip, user_agent, writer]
      actions: [LOGIN_TENANT_DISCOVERY]
      recordSchemaRef: "brix://schemas/test-owner/policy-use-record/1.0.0"
    # JdbcMessageOperationAuditTest: operators' actions on messages.
    - table: test_policy_audit
      custodian: runtime.message-operations
      operations: [INSERT]
      columns: [id, operator_identity_id, action, resource_type, resource_id, affected_tenants, context, success,
                error_code, execution_identity, reason_code, trace_id, source_ip, user_agent, writer]
      actions: [MESSAGE_REPLAYED, MESSAGE_DISCARDED, MESSAGE_REPUBLISHED]
      recordSchemaRef: "brix://schemas/test-owner/message-operation-record/1.0.0"
permissions: []
config: []
ui:
  web:
    enabled: false
