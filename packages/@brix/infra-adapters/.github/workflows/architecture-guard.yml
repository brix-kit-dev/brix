# ============================================================================
# Architecture Guard CI - Comprehensive Architecture Validation
# ============================================================================
#
# This CI pipeline enforces architectural rules from the Architecture Review
# Checklist (Appendix C). Applicable checks for infra-adapters are implemented here.
#
# ============================================================================
# Appendix C CI-compatible Check Item Reference
# ============================================================================
#
# | ID        | Check                              | Implementation      |
# |-----------|------------------------------------|--------------------|
# | R1.1-R1.4 | Adapter no business dependency     | POM dependency scan|
# | R7.1-R7.2 | Frontend layer import restrictions | ESLint rules       |
# | BP3/OS9   | Build artifacts not in Git         | git ls-files       |
# | BP4/OS1   | Secret leak detection              | gitleaks           |
# | RM1       | No .class files in source dirs     | find check         |
#
# 【Adapter Architecture Rules】
# - Adapters must implement corresponding Capability interfaces
# - Adapters use @ConditionalOnMissingBean for default implementations
# - Adapters must not depend on business modules (brix-app-*)
# ============================================================================

name: Architecture Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ========================================
  # 🔐 BP4/OS1: Secret Leak Detection
  # ========================================
  secret-scan:
    name: Secret Leak Scan (BP4/OS1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ========================================
  # 📦 BP3/OS9: Build Artifacts Check
  # ========================================
  build-artifacts-check:
    name: Build Artifacts Not in Git (BP3/OS9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for committed build artifacts
        run: |
          echo "🔍 Checking for committed build artifacts..."
          
          found=false
          
          DIST_FILES=$(git ls-files | grep -E "^dist/|/dist/" || true)
          if [ -n "$DIST_FILES" ]; then
            echo "❌ Found dist/ files committed to Git"
            found=true
          fi
          
          TARGET_FILES=$(git ls-files | grep -E "^target/|/target/" || true)
          if [ -n "$TARGET_FILES" ]; then
            echo "❌ Found target/ files committed to Git"
            found=true
          fi
          
          if [ "$found" = true ]; then
            exit 1
          else
            echo "✅ No build artifacts found in Git"
          fi

  # ========================================
  # ☕ RM1: No .class Files in Source
  # ========================================
  class-files-check:
    name: No .class in Source (RM1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for .class files in source directories
        run: |
          echo "🔍 Checking for .class files in source directories..."
          
          CLASS_FILES=$(find . -path "*/src/*" -name "*.class" -type f ! -path "*/target/*" 2>/dev/null || true)
          
          if [ -n "$CLASS_FILES" ]; then
            echo "❌ Found .class files in source directories:"
            echo "$CLASS_FILES"
            exit 1
          else
            echo "✅ No .class files found in source directories"
          fi

  # ========================================
  # Java Architecture Tests
  # ========================================
  java-architecture:
    name: Java Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Architecture Tests
        run: mvn test -Dtest="*ArchitectureTest" --fail-at-end -B
      
      - name: Check Adapter Implementation Standards
        run: |
          echo "Checking adapter implementation standards..."
          
          # Check whether each adapter module has an AutoConfiguration
          for dir in packages/server/infra-adapter-*; do
            if [ -d "$dir/src/main/java" ]; then
              adapter_name=$(basename "$dir")
              
              # Check for AutoConfiguration class
              has_autoconfig=$(find "$dir/src/main/java" -name "*AutoConfiguration.java" | head -1)
              
              if [ -z "$has_autoconfig" ]; then
                echo "WARNING: $adapter_name is missing an AutoConfiguration class"
              else
                echo "PASS: $adapter_name has AutoConfiguration"
              fi
              
              # Check for spring.factories or imports file
              has_spring_config=$(find "$dir/src/main/resources/META-INF/spring" -type f 2>/dev/null | head -1)
              
              if [ -z "$has_spring_config" ]; then
                echo "WARNING: $adapter_name is missing Spring Boot auto-configuration registration"
              else
                echo "PASS: $adapter_name has registered Spring Boot auto-configuration"
              fi
            fi
          done
      
      - name: Check No Business Dependencies
        run: |
          echo "Checking adapter business module dependencies..."
          
          # Check pom.xml for business module dependencies
          forbidden_deps=(
            "brix-app-"
            "identity-"
            "booking-"
            "messenger-"
            "partners-"
          )
          
          found_violations=false
          
          for dir in packages/server/infra-adapter-*; do
            if [ -f "$dir/pom.xml" ]; then
              adapter_name=$(basename "$dir")
              
              for dep in "${forbidden_deps[@]}"; do
                if grep -q "$dep" "$dir/pom.xml"; then
                  echo "FAIL: $adapter_name contains forbidden business dependency: $dep"
                  found_violations=true
                fi
              done
            fi
          done
          
          if [ "$found_violations" = true ]; then
            echo "WARNING: Adapter layer should not depend on business modules"
            exit 1
          else
            echo "PASS: No business module dependencies found in adapters"
          fi

  # ========================================
  # TypeScript Architecture Check (Web Adapters)
  # ========================================
  ts-architecture:
    name: TypeScript Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint
        run: pnpm lint
      
      - name: Check Direct Fetch Usage
        run: |
          echo "Checking adapters for architecture guardrail violations..."
          
          # Web adapter check: should not use fetch directly in non-OAuth code
          # Note: OAuth-related code is exempt (needs to call IdP directly)
          
          for dir in packages/web/infra-adapter-*; do
            if [ -d "$dir/src" ]; then
              adapter_name=$(basename "$dir")
              
              # Check fetch usage excluding OAuth-related files
              fetch_count=$(find "$dir/src" -name "*.ts" -o -name "*.tsx" | \
                            xargs grep -l "fetch(" 2>/dev/null | \
                            grep -v -i "oauth" | \
                            wc -l || echo 0)
              
              if [ "$fetch_count" -gt 0 ]; then
                echo "WARNING: $adapter_name has direct fetch() calls (non-OAuth code)"
                echo "    Please check whether HttpCapability should be used instead"
              fi
            fi
          done
          
          echo "PASS: Architecture guardrail check complete"

  # ========================================
  # 📋 Architecture Guard Summary
  # ========================================
  guard-summary:
    name: Architecture Guard Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, build-artifacts-check, class-files-check, java-architecture]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "============================================"
          echo "Architecture Guard - Appendix C Check Results Summary"
          echo "============================================"
          echo ""
          echo "| Check ID   | Job                     | Status |"
          echo "|------------|-------------------------|--------|"
          echo "| BP4/OS1    | Secret Leak Scan        | ${{ needs.secret-scan.result }} |"
          echo "| BP3/OS9    | Build Artifacts Check   | ${{ needs.build-artifacts-check.result }} |"
          echo "| RM1        | No .class in Source     | ${{ needs.class-files-check.result }} |"
          echo "| R1.1-R1.4  | Java Architecture       | ${{ needs.java-architecture.result }} |"
          echo ""
          
          # Check if any job failed
          if [ "${{ needs.secret-scan.result }}" = "failure" ] || \
             [ "${{ needs.build-artifacts-check.result }}" = "failure" ] || \
             [ "${{ needs.class-files-check.result }}" = "failure" ] || \
             [ "${{ needs.java-architecture.result }}" = "failure" ]; then
            echo "❌ Some architecture checks failed. Please fix before merging."
            exit 1
          else
            echo "✅ All architecture checks passed!"
          fi