# The sample publisher (Kafka design §14 K23). Everything the runtime needs to know about the plugin is here: the
# endpoints and who may call them, the events it publishes with their schemas and reliability, the query of another
# plugin it calls, the capabilities it uses and the data it owns. The plugin code only binds the endpoint handler; the schemas ship in sample-orders-api.
apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: sample-orders
  name: sample-orders
  version: 3.2.0
  displayName: Sample Orders
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.2.0 <4.0.0"
# Three artifacts (root BRX-RS-MANIFEST-005): the contract, the logic and data, the entry point and handlers.
modules:
  - groupId: io.brix.samples
    artifactId: sample-orders-api
    version: 3.2.0
    moduleKind: plugin-api
  - groupId: io.brix.samples
    artifactId: sample-orders-core
    version: 3.2.0
    moduleKind: plugin-core
  - groupId: io.brix.samples
    artifactId: sample-orders-server
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides:
    - endpointId: sample-orders.place.v1
      transport: http
      method: POST
      path: /api/sample-orders/orders
      request:
        schemaRef: brix://schemas/sample-orders/place-order-request/1.0.0
      response:
        schemaRef: brix://schemas/sample-orders/placed-order/1.0.0
        # A new order answers 201 Created (standard-link plan L7.3).
        status: 201
      handlerId: sample-orders.place.v1
      # A tenant member signed in with an access token; the runtime binds the tenant from the token.
      authentication:
        mode: required
        policyRef: tenant-actor
      authorization:
        permissions:
          - sample-orders:order:place
        decision: all
        resourcePolicyRef: sample-orders-place
      tenantContext:
        mode: required
        source: runtime
      timeout:
        policyRef: endpoint-default
      # The caller names a key in the Idempotency-Key header. A repeated call gets the first answer again and places no
      # second order (root BRX-RS-MANIFEST-018; standard-link plan point 10a).
      idempotency:
        mode: required
    - endpointId: sample-orders.show.v1
      transport: http
      method: GET
      path: /api/sample-orders/orders/{orderId}
      request:
        schemaRef: brix://schemas/sample-orders/find-order-request/1.0.0
      response:
        schemaRef: brix://schemas/sample-orders/order-detail/1.0.0
      handlerId: sample-orders.show.v1
      authentication:
        mode: required
        policyRef: tenant-actor
      authorization:
        permissions:
          - sample-orders:order:read
        decision: all
        resourcePolicyRef: sample-orders-read
      tenantContext:
        mode: required
        source: runtime
      timeout:
        policyRef: endpoint-default
      idempotency:
        mode: not-applicable
capabilities:
  required:
    - id: io.runtime.sdk.capability.EventBusCapability
      version: ">=3.0.10 <4.0.0"
    - id: io.runtime.sdk.capability.PersistenceCapability
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.IdGeneratorCapability
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.QueryCapability
      version: ">=3.3.0 <4.0.0"
  optional: []
# The order detail reads the shipment through sample-shipping's typed query (query design §4.2). Optional: without
# sample-shipping the order is still shown, with its shipment UNAVAILABLE.
queries:
  provides: []
  consumes:
    - queryType: sample-shipping.find-shipment
      versionRange: ">=1.0.0 <2.0.0"
      required: false
      timeoutPolicyRef: query-interactive
      retryPolicyRef: query-no-retry
# Other plugins ask for a cancellation with this typed command; its contract and generated types are in
# sample-orders-api (standard-link plan L4.7).
commands:
  provides:
    - commandType: sample-orders.cancel-order
      request:
        schemaRef: brix://schemas/sample-orders/cancel-order/1.1.0
      handlerId: sample-orders.cancel-order.v1
      scopePolicyRef: command-envelope
      accessPolicyRef: declared-consumers
      timeoutPolicyRef: command-standard
      concurrencyPolicyRef: partition-serial
      retryPolicyRef: command-transient-retry
      idempotencyPolicyRef: command-key
  consumes: []
events:
  publishes:
    # Through the outbox, in the order's unit of work: delivered at least once after the order commits.
    - eventType: SampleOrderPlaced
      schemaRef: brix://schemas/sample-orders/sample-order-placed/1.0.0
      version: 1.0.0
      reliability: STANDARD
    # Sent after the commit, not retried: for nothing that must happen.
    - eventType: SampleOrderActivity
      schemaRef: brix://schemas/sample-orders/sample-order-activity/1.0.0
      version: 1.0.0
      reliability: BEST_EFFORT
  subscribes: []
# A task the runtime's scheduler runs (standard-link plan L6.7): at each trigger one host claims it in
# sample_orders_task_run and runs it. The short interval is for the sample's end-to-end test; a host allows it only
# with brix.tasks.min-interval at or below it.
tasks:
  provides:
    - taskId: sample-orders.heartbeat
      handlerId: sample-orders.heartbeat.v1
      scopePolicyRef: task-platform
      executionIdentityPolicyRef: plugin-service
      triggerPolicyRef: "every:PT2S"
      timeoutPolicyRef: task-standard
      concurrencyPolicyRef: task-no-overlap
      retryPolicyRef: task-no-retry
      idempotencyPolicyRef: task-trigger
      # It touches no data, so it runs without a unit of work (root BRX-RS-DATA-028).
      transaction: none
# What a platform operational module may ask of sample-orders (root BRX-RS-HOST-021). The runtime runs each call in this
# plugin's unit of work (root BRX-RS-HOST-020).
internalContracts:
  provides:
    - contractId: brix.internal.sample-orders.administration
      contractType: io.brix.samples.orders.internal.SampleOrderAdministration
      contractVersion: 1.0.0
      providerId: sample-orders.internal.administration
      owner: sample-orders
      # An operational endpoint that writes through this method has its results replayed: the runtime keeps the method's
      # result in this plugin's table, with the write (idempotency design D79). It holds no secret or credential.
      replayableWrites:
        - adjustQuantity
# The platform creates sample_orders_outbox, sample_orders_inbox and sample_orders_command_idempotency from its own
# versioned migrations; db/migration/sample-orders holds only the plugin's business tables.
data:
  storageId: sample_orders
  schema: sample-orders
  migrationLocation: db/migration/sample-orders
  outbox: sample_orders_outbox
  inbox: sample_orders_inbox
permissions:
  - id: sample-orders:order:read
    name: Read sample orders
    description: Allows reading the orders of the current tenant.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
      - {role: MEMBER, scope: TENANT}
  - id: sample-orders:order:place
    name: Place sample orders
    description: Allows placing an order in the current tenant.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
      - {role: MEMBER, scope: TENANT}
config: []
ui:
  web:
    enabled: false
