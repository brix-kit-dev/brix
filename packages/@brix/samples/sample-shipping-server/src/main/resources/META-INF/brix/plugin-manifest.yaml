# The sample subscriber (Kafka design §14 K23): it subscribes to sample-orders' SampleOrderPlaced and
# SampleOrderQuantityAdjusted with a persistent inbox, so each event changes its data once however often it arrives,
# and shows each order's shipment, over HTTP and as a typed query other plugins call (query design §4.1). A shipment it refuses asks sample-orders to cancel the
# order with sample-orders' typed command (standard-link plan L4.7).
apiVersion: brix.io/v1
kind: Plugin
metadata:
  pluginId: sample-shipping
  name: sample-shipping
  version: 3.2.0
  displayName: Sample Shipping
  vendor: Brix Platform
  license: Apache-2.0
runtime:
  compiledAgainst: 3.2.0
  supportedRange: ">=3.2.0 <4.0.0"
# Three artifacts (root BRX-RS-MANIFEST-005): the contract, the logic and data, the entry point and handlers.
modules:
  - groupId: io.brix.samples
    artifactId: sample-shipping-api
    version: 3.2.0
    moduleKind: plugin-api
  - groupId: io.brix.samples
    artifactId: sample-shipping-core
    version: 3.2.0
    moduleKind: plugin-core
  - groupId: io.brix.samples
    artifactId: sample-shipping-server
    version: 3.2.0
    moduleKind: plugin-server
endpoints:
  provides:
    - endpointId: sample-shipping.find-shipment.v1
      transport: http
      method: GET
      path: /api/sample-shipping/shipments/{orderId}
      request:
        schemaRef: brix://schemas/sample-shipping/find-shipment-request/1.0.0
      response:
        schemaRef: brix://schemas/sample-shipping/shipment/1.0.0
      handlerId: sample-shipping.find-shipment.v1
      authentication:
        mode: required
        policyRef: tenant-actor
      authorization:
        permissions:
          - sample-shipping:shipment:read
        decision: all
        resourcePolicyRef: sample-shipping-shipment-read
      tenantContext:
        mode: required
        source: runtime
      timeout:
        policyRef: endpoint-default
      idempotency:
        mode: not-applicable
    - endpointId: sample-shipping.refuse-shipment.v1
      transport: http
      method: POST
      path: /api/sample-shipping/shipments/{orderId}/refuse
      request:
        schemaRef: brix://schemas/sample-shipping/refuse-shipment-request/1.1.0
      response:
        schemaRef: brix://schemas/sample-shipping/refused-shipment/1.0.0
        # The cancellation is queued, not done: 202 Accepted (standard-link plan L7.3).
        status: 202
      handlerId: sample-shipping.refuse-shipment.v1
      authentication:
        mode: required
        policyRef: tenant-actor
      authorization:
        permissions:
          - sample-shipping:shipment:refuse
        decision: all
        resourcePolicyRef: sample-shipping-shipment-refuse
      tenantContext:
        mode: required
        source: runtime
      timeout:
        policyRef: endpoint-default
      # A repeated refusal is harmless: the command's business key is the order id, so sample-orders cancels once.
      idempotency:
        mode: not-applicable
    # Where a refusal's cancellation stands, by the command id it answered with (standard-link plan point 7).
    - endpointId: sample-shipping.find-cancellation.v1
      transport: http
      method: GET
      path: /api/sample-shipping/cancellations/{commandId}
      request:
        schemaRef: brix://schemas/sample-shipping/cancellation-request/1.0.0
      response:
        schemaRef: brix://schemas/sample-shipping/cancellation/1.0.0
      handlerId: sample-shipping.find-cancellation.v1
      authentication:
        mode: required
        policyRef: tenant-actor
      authorization:
        permissions:
          - sample-shipping:shipment:read
        decision: all
        resourcePolicyRef: sample-shipping-shipment-read
      tenantContext:
        mode: required
        source: runtime
      timeout:
        policyRef: interactive-read
      idempotency:
        mode: not-applicable
capabilities:
  required:
    - id: io.runtime.sdk.capability.PersistenceCapability
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.IdGeneratorCapability
      version: ">=3.2.0 <4.0.0"
    - id: io.runtime.sdk.capability.CommandCapability
      version: ">=3.2.0 <4.0.0"
  optional: []
# A typed query for other plugins (query design §4.1): its contract and generated types ship in sample-shipping-api.
queries:
  provides:
    - queryType: sample-shipping.find-shipment
      request:
        schemaRef: brix://schemas/sample-shipping/find-shipment-request/1.0.0
      response:
        schemaRef: brix://schemas/sample-shipping/shipment/1.0.0
      handlerId: sample-shipping.find-shipment.query.v1
      # In the caller's tenant, for a caller whose user may read shipments.
      scopePolicyRef: query-caller-tenant
      accessPolicyRef: on-behalf-of:sample-shipping:shipment:read
      timeoutPolicyRef: query-interactive
      concurrencyPolicyRef: query-standard
  consumes: []
# A refused shipment cancels the order: sample-orders owns orders, so sample-shipping asks with its command, whose
# contract and generated type it takes from sample-orders-api (root LIFE-010: the api artifact only).
commands:
  provides: []
  consumes:
    - commandType: sample-orders.cancel-order
      versionRange: ">=1.0.0 <2.0.0"
      # Refusing a shipment means nothing without the order's owner, so the plugin starts only next to sample-orders.
      # The command is delivered under the policies sample-orders declares for it, so a sender names none.
      required: true
events:
  publishes: []
  subscribes:
    - subscriptionId: prepare-shipment
      eventType: SampleOrderPlaced
      # Any 1.x of the publisher's schema; a 2.0.0 event is parked instead of misread.
      schemaRange: ">=1.0.0 <2.0.0"
      handlerId: sample-shipping.prepare-shipment.v1
      # A TENANT event is handled in its own tenant.
      scopePolicyRef: sample-shipping-order-tenant
      # Only the plugin that declares SampleOrderPlaced may publish it.
      publisherPolicyRef: sample-orders-owner
      timeoutPolicyRef: event-standard
      concurrencyPolicyRef: partition-serial
      retryPolicyRef: event-standard
      idempotencyPolicyRef: persistent-inbox
    # An operator's change of an order, which sample-orders publishes from its internal contract (standard-link plan
    # D125). Events of different types are not ordered, so it can arrive before the order's SampleOrderPlaced: the
    # order's version decides which state is newer, and whichever event comes first prepares the shipment.
    - subscriptionId: follow-quantity
      eventType: SampleOrderQuantityAdjusted
      schemaRange: ">=1.0.0 <2.0.0"
      handlerId: sample-shipping.follow-quantity.v1
      scopePolicyRef: sample-shipping-order-tenant
      publisherPolicyRef: sample-orders-owner
      timeoutPolicyRef: event-standard
      concurrencyPolicyRef: partition-serial
      retryPolicyRef: event-standard
      idempotencyPolicyRef: persistent-inbox
tasks:
  provides: []
internalContracts:
  provides: []
# The platform creates sample_shipping_inbox, and sample_shipping_outbox for the commands it sends, from its own
# versioned migrations; db/migration/sample-shipping holds only the plugin's business tables.
data:
  storageId: sample_shipping
  schema: sample-shipping
  migrationLocation: db/migration/sample-shipping
  outbox: sample_shipping_outbox
  inbox: sample_shipping_inbox
permissions:
  - id: sample-shipping:shipment:read
    name: Read sample shipments
    description: Allows reading the shipments of the current tenant.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
      - {role: MEMBER, scope: TENANT}
  - id: sample-shipping:shipment:refuse
    name: Refuse sample shipments
    description: Allows refusing a shipment of the current tenant, which cancels its order.
    grants:
      - {role: OWNER, scope: TENANT}
      - {role: ADMIN, scope: TENANT}
      - {role: MEMBER, scope: TENANT}
config: []
ui:
  web:
    enabled: false
