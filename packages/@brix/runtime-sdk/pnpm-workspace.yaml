# Brix Runtime SDK - pnpm workspace 配置
# 定义前端模块工作区，与后端 Maven 模块并行
packages:
  # ═══════ Web 前端模块 ═══════
  - 'runtime-sdk-api-web'          # Web 能力契约（含共享类型）
  - 'runtime-sdk-react'            # React 绑定层（v3.2 新增）
  - 'runtime-orchestrator-web'     # Web 运行时编排
  - 'runtime-manifest-web'         # Web 清单解析
  
  # ═══════ Mobile 前端模块 ═══════
  - 'runtime-sdk-api-mobile'       # Mobile 能力契约（React Native）
  # - 'runtime-orchestrator-mobile' # Mobile 运行时编排（Phase 2）
  
  # ═══════ 已弃用模块 ═══════
  # - 'runtime-sdk-shared'         # 已合并到 runtime-sdk-api-web
