# ============================================================================
# Architecture Guard CI - Comprehensive Architecture Validation
# ============================================================================
#
# This CI pipeline enforces architectural rules from the Architecture Review
# Checklist (Appendix C). Applicable checks for runtime-sdk are implemented here.
#
# ============================================================================
# Appendix C CI-compatible Check Item Reference
# ============================================================================
#
# | ID        | Check                              | Implementation      |
# |-----------|------------------------------------|--------------------|
# | R1.1-R1.4 | Plugin core no infra dependency    | Contract purity    |
# | R7.1-R7.2 | Frontend layer import restrictions | ESLint rules       |
# | BP3/OS9   | Build artifacts not in Git         | git ls-files       |
# | BP4/OS1   | Secret leak detection              | gitleaks           |
# | RM1       | No .class files in source dirs     | find check         |
# | FS5       | No localStorage in plugin layer    | ESLint rules       |
#
# 【Contract Layer Purity Principle】
# - runtime-sdk-api: Zero compile-time dependencies (except SLF4J)
# - runtime-sdk-api-web: No framework-specific imports (React/Vue/Angular)
# ============================================================================

name: Architecture Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ========================================
  # 🔐 BP4/OS1: Secret Leak Detection
  # ========================================
  secret-scan:
    name: Secret Leak Scan (BP4/OS1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ========================================
  # 📦 BP3/OS9: Build Artifacts Check
  # ========================================
  build-artifacts-check:
    name: Build Artifacts Not in Git (BP3/OS9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for committed build artifacts
        run: |
          echo "🔍 Checking for committed build artifacts..."
          
          found=false
          
          # Check for dist/ directories in git
          DIST_FILES=$(git ls-files | grep -E "^dist/|/dist/" || true)
          if [ -n "$DIST_FILES" ]; then
            echo "❌ Found dist/ files committed to Git:"
            echo "$DIST_FILES" | head -20
            found=true
          fi
          
          # Check for target/ directories in git
          TARGET_FILES=$(git ls-files | grep -E "^target/|/target/" || true)
          if [ -n "$TARGET_FILES" ]; then
            echo "❌ Found target/ files committed to Git:"
            echo "$TARGET_FILES" | head -20
            found=true
          fi
          
          if [ "$found" = true ]; then
            echo ""
            echo "⚠️  Build artifacts should be in .gitignore, not committed to Git"
            exit 1
          else
            echo "✅ No build artifacts found in Git"
          fi

  # ========================================
  # ☕ RM1: No .class Files in Source
  # ========================================
  class-files-check:
    name: No .class in Source (RM1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for .class files in source directories
        run: |
          echo "🔍 Checking for .class files in source directories..."
          
          CLASS_FILES=$(find . -path "*/src/*" -name "*.class" -type f ! -path "*/target/*" 2>/dev/null || true)
          
          if [ -n "$CLASS_FILES" ]; then
            echo "❌ Found .class files in source directories:"
            echo "$CLASS_FILES"
            exit 1
          else
            echo "✅ No .class files found in source directories"
          fi
  # ========================================
  # Java Contract Layer Check
  # ========================================
  java-contract-purity:
    name: Java Contract Layer Purity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Contract Layer Zero-Dependency Check
        run: |
          echo "Checking runtime-sdk-api compile-time dependencies..."
          
          # runtime-sdk-api only allows SLF4J API as the sole compile-time dependency
          cd runtime-sdk-api
          
          # List compile-time dependencies using Maven
          DEPS=$(mvn dependency:list -DincludeScope=compile -DexcludeArtifactIds=slf4j-api 2>/dev/null | grep ':compile' | grep -v 'slf4j-api' || true)
          
          if [ -n "$DEPS" ]; then
            echo "FAIL: runtime-sdk-api has illegal compile-time dependencies:"
            echo "$DEPS"
            echo ""
            echo "WARNING: The contract layer (runtime-sdk-api) should be zero-dependency pure POJO interfaces"
            echo "    The only allowed dependency is SLF4J API (for defining the logging interface)"
            exit 1
          else
            echo "PASS: runtime-sdk-api contract layer dependency check passed"
          fi

      - name: Contract Layer No Business Logic Check
        run: |
          echo "Checking runtime-sdk-api for business logic..."
          
          # Check for @Service, @Repository, @Controller annotations
          VIOLATIONS=$(grep -r -l "@Service\|@Repository\|@Controller\|@Component" runtime-sdk-api/src/main/java 2>/dev/null || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: runtime-sdk-api contains Spring component annotations:"
            echo "$VIOLATIONS"
            echo ""
            echo "WARNING: The contract layer should not contain any Spring component annotations"
            exit 1
          else
            echo "PASS: runtime-sdk-api has no business component annotations"
          fi

  # ========================================
  # TypeScript Contract Layer Check
  # ========================================
  ts-contract-purity:
    name: TypeScript Contract Layer Purity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Contract Layer No-Framework Check
        run: |
          echo "Checking runtime-sdk-api-web for framework-specific imports..."
          
          # Check for React imports
          REACT_IMPORTS=$(grep -rn "from 'react'\|from \"react\"\|from 'react-dom'\|from \"react-dom\"" runtime-sdk-api-web/src/ 2>/dev/null || true)
          
          if [ -n "$REACT_IMPORTS" ]; then
            echo "FAIL: runtime-sdk-api-web imports React:"
            echo "$REACT_IMPORTS"
            echo ""
            echo "WARNING: The contract layer should not import any framework-specific code"
            echo "    React-related code should be in runtime-sdk-react"
            exit 1
          fi
          
          # Check for Vue imports
          VUE_IMPORTS=$(grep -rn "from 'vue'\|from \"vue\"" runtime-sdk-api-web/src/ 2>/dev/null || true)
          
          if [ -n "$VUE_IMPORTS" ]; then
            echo "FAIL: runtime-sdk-api-web imports Vue:"
            echo "$VUE_IMPORTS"
            exit 1
          fi
          
          # Check for Angular imports
          ANGULAR_IMPORTS=$(grep -rn "from '@angular" runtime-sdk-api-web/src/ 2>/dev/null || true)
          
          if [ -n "$ANGULAR_IMPORTS" ]; then
            echo "FAIL: runtime-sdk-api-web imports Angular:"
            echo "$ANGULAR_IMPORTS"
            exit 1
          fi
          
          echo "PASS: runtime-sdk-api-web contract layer has no framework-specific imports"

      - name: Contract Layer No Runtime Dependency Check
        run: |
          echo "Checking runtime-sdk-api-web runtime dependencies..."
          
          cd runtime-sdk-api-web
          
          # Check dependencies field in package.json (excluding devDependencies)
          DEPS=$(cat package.json | grep -A 100 '"dependencies"' | grep -B 100 '}' | head -n -1 | grep -v '"dependencies"' | grep -v '^$' || true)
          
          # dependencies field should be empty or contain only type definitions
          if echo "$DEPS" | grep -v "@types/" | grep -v "^$" | grep -v "^{$" | grep -v "^}$" > /dev/null 2>&1; then
            echo "WARNING: runtime-sdk-api-web may have runtime dependencies:"
            echo "$DEPS"
            echo ""
            echo "    The contract layer should have zero runtime dependencies (pure type definitions only)"
          fi
          
          echo "PASS: runtime-sdk-api-web dependency check complete"

  # ========================================
  # File Complexity Gate
  # ========================================
  file-complexity-gate:
    name: File Complexity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java File Size Check
        run: |
          echo "Checking Java file line counts (threshold: 300 lines)..."
          
          failed=false
          
          find . -name '*.java' -path '*/src/main/*' | while read f; do
            # Count effective code lines (excluding empty lines and comment-only lines)
            LINES=$(cat "$f" | grep -v '^\s*$' | grep -v '^\s*//' | grep -v '^\s*\*' | grep -v '^\s*/\*' | wc -l)
            
            if [ "$LINES" -gt 300 ]; then
              echo "FAIL: $f: $LINES lines (exceeds 300 line limit)"
              echo "FAILED=true" >> $GITHUB_ENV
            fi
          done
          
          if [ "${FAILED:-}" = "true" ]; then
            echo ""
            echo "WARNING: Java files exceeding 300 lines detected; consider refactoring"
            exit 1
          else
            echo "PASS: Java file line count check passed"
          fi

      - name: TypeScript File Size Check
        run: |
          echo "Checking TypeScript file line counts (threshold: 500 lines)..."
          
          find . -name '*.ts' -path '*/src/*' ! -name '*.d.ts' ! -name '*.spec.ts' ! -name '*.test.ts' | while read f; do
            LINES=$(wc -l < "$f")
            
            if [ "$LINES" -gt 500 ]; then
              echo "FAIL: $f: $LINES lines (exceeds 500 line limit)"
              echo "FAILED=true" >> $GITHUB_ENV
            fi
          done
          
          if [ "${FAILED:-}" = "true" ]; then
            echo ""
            echo "WARNING: TypeScript files exceeding 500 lines detected; consider refactoring"
            exit 1
          else
            echo "PASS: TypeScript file line count check passed"
          fi

  # ========================================
  # Circular Dependency Detection
  # ========================================
  circular-dependency-check:
    name: Circular Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install madge
        run: pnpm add -g madge

      - name: Check TypeScript Circular Dependencies
        run: |
          echo "Checking TypeScript circular dependencies..."
          
          # Check each package for circular dependencies
          for pkg in runtime-sdk-api-web runtime-sdk-react runtime-orchestrator-web runtime-manifest-web; do
            if [ -d "$pkg/src" ]; then
              echo "Checking $pkg..."
              CYCLES=$(madge --circular --extensions ts,tsx "$pkg/src" 2>/dev/null || true)
              
              if [ -n "$CYCLES" ] && [ "$CYCLES" != "No circular dependency found!" ]; then
                echo "FAIL: $pkg has circular dependencies:"
                echo "$CYCLES"
                echo "FAILED=true" >> $GITHUB_ENV
              else
                echo "PASS: $pkg has no circular dependencies"
              fi
            fi
          done
          
          if [ "${FAILED:-}" = "true" ]; then
            echo ""
            echo "WARNING: Circular dependencies detected; please refactor to eliminate circular references"
            exit 1
          fi

  # ========================================
  # ESLint Architecture Rules Check
  # ========================================
  eslint-check:
    name: ESLint Architecture Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ========================================
  # 📋 Architecture Guard Summary
  # ========================================
  guard-summary:
    name: Architecture Guard Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, build-artifacts-check, class-files-check, java-contract-purity, ts-contract-purity, file-complexity-gate, circular-dependency-check, eslint-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "============================================"
          echo "Architecture Guard - Appendix C Check Results Summary"
          echo "============================================"
          echo ""
          echo "| Check ID   | Job                     | Status |"
          echo "|------------|-------------------------|--------|"
          echo "| BP4/OS1    | Secret Leak Scan        | ${{ needs.secret-scan.result }} |"
          echo "| BP3/OS9    | Build Artifacts Check   | ${{ needs.build-artifacts-check.result }} |"
          echo "| RM1        | No .class in Source     | ${{ needs.class-files-check.result }} |"
          echo "| R1.1-R1.4  | Java Contract Purity    | ${{ needs.java-contract-purity.result }} |"
          echo "| R1.1-R1.4  | TS Contract Purity      | ${{ needs.ts-contract-purity.result }} |"
          echo "| File Size  | Complexity Gate         | ${{ needs.file-complexity-gate.result }} |"
          echo "| Import     | Circular Dependencies   | ${{ needs.circular-dependency-check.result }} |"
          echo "| R7.1-R7.2  | ESLint Rules            | ${{ needs.eslint-check.result }} |"
          echo ""
          
          # Check if any job failed
          if [ "${{ needs.secret-scan.result }}" = "failure" ] || \
             [ "${{ needs.build-artifacts-check.result }}" = "failure" ] || \
             [ "${{ needs.class-files-check.result }}" = "failure" ] || \
             [ "${{ needs.java-contract-purity.result }}" = "failure" ] || \
             [ "${{ needs.ts-contract-purity.result }}" = "failure" ]; then
            echo "❌ Some architecture checks failed. Please fix before merging."
            exit 1
          else
            echo "✅ All architecture checks passed!"
          fi