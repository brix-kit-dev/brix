# Brix Open Source Monorepo Workspace Configuration
#
# This file defines the workspace packages for pnpm.
# All packages under packages/@brix/* are included as workspace members.
#
# Architecture Layer: Build Infrastructure
# License: Apache 2.0
# Version: 3.1.0
# ============================================================================

packages:
  # ==================== Core Packages ====================
  # Runtime SDK - Capability contracts and orchestration engine
  - 'packages/@brix/runtime-sdk'
  - 'packages/@brix/runtime-sdk/*'
  
  # Infrastructure Adapters - Concrete capability implementations
  - 'packages/@brix/infra-adapters'
  - 'packages/@brix/infra-adapters/*'
  
  # Platform Commons - Platform-level shared capabilities
  - 'packages/@brix/platform-commons'
  - 'packages/@brix/platform-commons/*'
  
  # Platform DevTools - Development and build tooling
  - 'packages/@brix/platform-devtools'
  - 'packages/@brix/platform-devtools/*'
  
  # ==================== Examples ====================
  - 'examples/*'

# ============================================================================
# Catalog (pnpm 8.6+) - Shared dependency versions across workspace
# Use catalog: prefix in package.json to reference these versions
# ============================================================================
catalog:
  # Build Tools
  typescript: ^5.3.0
  tsup: ^8.0.1
  vite: ^5.0.0
  vitest: ^1.2.0
  
  # Code Quality
  eslint: ^8.56.0
  prettier: ^3.2.0
  
  # React Ecosystem
  react: ^18.3.0
  react-dom: ^18.3.0
  
  # Release Management
  "@changesets/cli": ^2.27.1
  "@changesets/changelog-github": ^0.5.0
